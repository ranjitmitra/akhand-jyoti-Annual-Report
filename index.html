<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akhand Jyoti — Annual Report 2025–26</title>
<style>
:root{
  --bg1:#3a3a3a;
  --bg2:#181818;
  --ui:rgba(22,22,22,.88);
  --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(ellipse at center 42%,#454545 0%,#2a2a2a 34%,#151515 76%,#0d0d0d 100%);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}
#reader{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#bookWrap{
  position:relative;
  width:min(94vw,1240px);
  height:min(86vh,900px);
  display:flex;align-items:center;justify-content:center;
}
#book{
  position:relative;
  margin:auto;
  box-shadow:0 24px 55px rgba(0,0,0,.5);
}
.page{
  background:#fff;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.page img{
  width:100%;height:100%;display:block;
  object-fit:contain;background:#fff;
  user-select:none;-webkit-user-drag:none;
}
.page-cover{
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}
#loader{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:#171717;
  transition:opacity .3s;
}
.loader-inner{text-align:center;color:#ddd;font-size:13px}
.spinner{
  width:34px;height:34px;margin:0 auto 13px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.18);
  border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#title{
  position:fixed;z-index:500;top:12px;left:50%;
  transform:translateX(-50%);
  font-size:13px;font-weight:600;color:rgba(255,255,255,.78);
  pointer-events:none;white-space:nowrap;
}
.edgeNav{
  position:fixed;z-index:700;
  top:50%;transform:translateY(-50%);
  width:58px;height:116px;
  border:0;border-radius:14px;
  background:rgba(18,18,18,.72);
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  backdrop-filter:blur(8px);
  transition:background .2s,opacity .2s,transform .2s;
}
.edgeNav:hover{background:rgba(40,40,40,.94)}
.edgeNav:active{transform:translateY(-50%) scale(.96)}
.edgeNav span{
  font-size:54px;font-weight:200;line-height:1;
  margin-top:-4px;
}
#prevEdge{left:18px}
#nextEdge{right:18px}
.edgeNav.disabled{opacity:.18;pointer-events:none}
#controls{
  position:fixed;z-index:800;left:50%;bottom:14px;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  padding:7px 9px;border-radius:12px;
  background:var(--ui);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 9px 28px rgba(0,0,0,.42);
  backdrop-filter:blur(12px);
}
.control{
  width:38px;height:35px;border:1px solid rgba(255,255,255,.12);
  border-radius:7px;background:#303030;color:#fff;
  cursor:pointer;font-size:16px;
}
.control:hover{background:#414141}
#pageInfo{
  min-width:95px;text-align:center;font-size:12px;
  color:#ddd;font-variant-numeric:tabular-nums;
}
#zoomLabel{width:48px;font-size:11px}
#hint{
  position:fixed;z-index:500;right:16px;bottom:20px;
  font-size:11px;color:rgba(255,255,255,.38);
}
@media(max-width:850px){
  #bookWrap{width:100vw;height:82vh}
  .edgeNav{width:46px;height:92px;border-radius:10px}
  .edgeNav span{font-size:42px}
  #prevEdge{left:6px}
  #nextEdge{right:6px}
  #title{font-size:11px;max-width:88%;overflow:hidden;text-overflow:ellipsis}
  #hint{display:none}
}
@media(max-width:520px){
  #controls{bottom:7px}
  .control{width:34px;height:33px}
  #pageInfo{min-width:74px}
}
</style>
</head>
<body>
<div id="reader">
  <div id="bookWrap"><div id="book"></div></div>
</div>

<div id="title">Akhand Jyoti — Annual Report 2025–26</div>

<!-- Prominent Heyzine-style page-turn markers -->
<button id="prevEdge" class="edgeNav disabled" aria-label="Previous page" title="Previous page">
  <span>‹</span>
</button>
<button id="nextEdge" class="edgeNav" aria-label="Next page" title="Next page">
  <span>›</span>
</button>

<div id="controls">
  <button class="control" id="prev" title="Previous page">‹</button>
  <div id="pageInfo">Cover</div>
  <button class="control" id="next" title="Next page">›</button>
  <button class="control" id="zoomOut" title="Zoom out">−</button>
  <button class="control" id="zoomLabel" title="Reset zoom">100%</button>
  <button class="control" id="zoomIn" title="Zoom in">+</button>
  <button class="control" id="full" title="Fullscreen">⛶</button>
</div>
<div id="hint">Drag a page corner or use the arrows</div>

<div id="loader">
  <div class="loader-inner">
    <div class="spinner"></div>
    <div id="loadText">Preparing your annual report…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script type="module">
const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const PDF_FILE="Annual report 25-26_V2.pdf";
const book=document.getElementById("book");
const wrap=document.getElementById("bookWrap");
const loader=document.getElementById("loader");
const loadText=document.getElementById("loadText");
const info=document.getElementById("pageInfo");
const prev=document.getElementById("prev");
const next=document.getElementById("next");
const prevEdge=document.getElementById("prevEdge");
const nextEdge=document.getElementById("nextEdge");
const zoomIn=document.getElementById("zoomIn");
const zoomOut=document.getElementById("zoomOut");
const zoomLabel=document.getElementById("zoomLabel");
const full=document.getElementById("full");

let pdf=null,pageFlip=null,images=[],zoom=1,total=82;

function setLoad(t){loadText.textContent=t}

function createPage(src,i){
  const p=document.createElement("div");
  p.className="page"+(i===0||i===total-1?" page-cover":"");
  if(i===0||i===total-1)p.dataset.density="hard";
  const img=document.createElement("img");
  img.src=src;img.alt="Annual Report page "+(i+1);
  p.appendChild(img);book.appendChild(p);
}

async function render(n){
  const page=await pdf.getPage(n);
  const vp=page.getViewport({scale:1});
  const s=1.25;
  const v=page.getViewport({scale:s});
  const c=document.createElement("canvas");
  const ctx=c.getContext("2d",{alpha:false});
  c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);
  await page.render({canvasContext:ctx,viewport:v}).promise;
  return c.toDataURL("image/jpeg",.9);
}

function update(index){
  // page-flip index is zero based. In cover mode, the first and last pages
  // are shown alone; interior pages are naturally displayed as spreads.
  if(index===0)info.textContent="Cover";
  else if(index===total-1)info.textContent="Back cover";
  else{
    const a=index+1;
    const b=Math.min(index+2,total-1);
    info.textContent=`${a}–${b} / ${total}`;
  }
  const atStart=index===0,atEnd=index===total-1;
  prev.disabled=atStart;prevEdge.classList.toggle("disabled",atStart);
  next.disabled=atEnd;nextEdge.classList.toggle("disabled",atEnd);
}

function applyZoom(){
  book.style.transform=`scale(${zoom})`;
  zoomLabel.textContent=Math.round(zoom*100)+"%";
}

function doNext(){if(pageFlip)pageFlip.flipNext("bottom")}
function doPrev(){if(pageFlip)pageFlip.flipPrev("bottom")}

prev.onclick=doPrev;prevEdge.onclick=doPrev;
next.onclick=doNext;nextEdge.onclick=doNext;
zoomIn.onclick=()=>{zoom=Math.min(1.5,zoom+.1);applyZoom()};
zoomOut.onclick=()=>{zoom=Math.max(.8,zoom-.1);applyZoom()};
zoomLabel.onclick=()=>{zoom=1;applyZoom()};
full.onclick=async()=>{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();
  else await document.exitFullscreen?.();
};

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown")doNext();
  if(e.key==="ArrowLeft"||e.key==="PageUp")doPrev();
  if(e.key==="+"){zoom=Math.min(1.5,zoom+.1);applyZoom()}
  if(e.key==="-"){zoom=Math.max(.8,zoom-.1);applyZoom()}
  if(e.key==="0"){zoom=1;applyZoom()}
  if(e.key.toLowerCase()==="f")full.click();
});

try{
  pdf=await pdfjsLib.getDocument({url:PDF_FILE}).promise;
  total=pdf.numPages;
  setLoad(`Preparing ${total} pages…`);

  for(let i=1;i<=total;i++){
    setLoad(`Preparing page ${i} of ${total}…`);
    images.push(await render(i));
  }

  images.forEach((src,i)=>createPage(src,i));

  const PageFlip=window.St.PageFlip;
  if(!PageFlip)throw new Error("Page flip library unavailable");

  const aspect=await pdf.getPage(1).then(p=>p.getViewport({scale:1}));
  pageFlip=new PageFlip(book,{
    width:aspect.width,
    height:aspect.height,
    size:"stretch",
    minWidth:280,
    maxWidth:900,
    minHeight:396,
    maxHeight:1273,
    drawShadow:true,
    maxShadowOpacity:.42,
    flippingTime:780,
    usePortrait:true,
    showCover:true,
    startPage:0,
    autoSize:true,
    mobileScrollSupport:false,
    swipeDistance:35,
    useMouseEvents:true,
    disableFlipByClick:false
  });

  pageFlip.loadFromHtml(book.querySelectorAll(".page"));
  pageFlip.on("flip",e=>update(e.data));
  pageFlip.on("changeOrientation",()=>update(pageFlip.getCurrentPageIndex()));
  update(0);

  loader.style.opacity="0";
  setTimeout(()=>loader.style.display="none",320);
}catch(err){
  console.error(err);
  setLoad("Unable to open the annual report.");
  document.querySelector(".spinner").style.display="none";
}
</script>
</body>
</html>
