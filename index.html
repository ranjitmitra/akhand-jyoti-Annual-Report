<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Akhand Jyoti Annual Report 2025–26</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;color:#fff;font-family:Arial,Helvetica,sans-serif}
#app{position:relative;width:100%;height:100%;background:radial-gradient(ellipse at center,#303030 0%,#202020 42%,#111 100%);overflow:hidden}
#bookArea{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:48px 88px 70px}
#book{position:relative;filter:drop-shadow(0 22px 38px rgba(0,0,0,.58))}
#seam{position:absolute;left:50%;top:0;width:16px;height:100%;transform:translateX(-50%);z-index:12;pointer-events:none;display:none;background:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.08) 30%,rgba(0,0,0,.30) 50%,rgba(0,0,0,.08) 70%,transparent 100%);mix-blend-mode:multiply}
#seam.open{display:block}
.page{background:#fff;overflow:hidden;position:relative}
.page canvas{display:block;width:100%;height:100%;background:#fff}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:#151515;color:#ddd;font-size:15px}
#loading.hidden{display:none}
#error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;z-index:21;color:#ddd}
#error div{max-width:560px;padding:30px}
#error strong{display:block;color:#fff;font-size:20px;margin-bottom:10px}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:15;width:58px;height:92px;border:0;border-radius:14px;background:rgba(20,20,20,.78);color:#fff;display:flex;align-items:center;justify-content:center;font-size:58px;line-height:1;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.4);transition:.18s}
.nav:hover{background:rgba(45,45,45,.94);transform:translateY(-50%) scale(1.04)}
.nav:disabled{opacity:.22;cursor:default;transform:translateY(-50%)}
#prev{left:18px}#next{right:18px}
#bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:20px;background:rgba(15,15,15,.72);backdrop-filter:blur(8px);font-size:13px;white-space:nowrap}
#pageText{min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
#zoomOut,#zoomIn,#full{width:30px;height:30px;border:0;border-radius:50%;background:#333;color:#fff;cursor:pointer;font-size:18px;line-height:30px;padding:0}
#zoomOut:hover,#zoomIn:hover,#full:hover{background:#4a4a4a}
#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:10;color:rgba(255,255,255,.55);font-size:12px;pointer-events:none}
@media(max-width:700px){
 #bookArea{padding:30px 52px 60px}.nav{width:45px;height:72px;font-size:43px}.nav#prev{left:7px}.nav#next{right:7px}
 #hint{display:none}
}
@media(prefers-reduced-motion:reduce){.nav{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="loading">Loading annual report…</div>
  <div id="error"><div><strong>Unable to open the annual report</strong><span id="errorText"></span></div></div>
  <div id="bookArea"><div id="book"></div><div id="seam"></div></div>
  <button id="prev" class="nav" aria-label="Previous page">‹</button>
  <button id="next" class="nav" aria-label="Next page">›</button>
  <div id="hint">Click the page, use the arrows, or use ← →</div>
  <div id="bottom">
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <span id="pageText">1 / …</span>
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="full" aria-label="Fullscreen">⛶</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script type="module">
const PDF_FILE = "Annual report 25-26_V2.pdf";
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
const PDF_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
const pageFlipLib = window.St && window.St.PageFlip ? window.St.PageFlip : window.PageFlip;

const loading=document.getElementById('loading');
const error=document.getElementById('error');
const errorText=document.getElementById('errorText');
const bookEl=document.getElementById('book');
const pageText=document.getElementById('pageText');
const prev=document.getElementById('prev');
const next=document.getElementById('next');
let pdf=null, flip=null, pageWidth=596, pageHeight=842, zoom=1;
const seam=document.getElementById('seam');

function setPageText(){
  if(!pdf||!flip)return;
  const p=flip.getCurrentPageIndex()+1;
  pageText.textContent=`${Math.min(p,pdf.numPages)} / ${pdf.numPages}`;
  seam.classList.toggle('open', p>1 && p<pdf.numPages);
  prev.disabled=p<=1;
  next.disabled=p>=pdf.numPages;
}

function fitSize(){
  const area=document.getElementById('bookArea');
  const maxW=(area.clientWidth-10)/2;
  const maxH=area.clientHeight-10;
  const ratio=pageWidth/pageHeight;
  let w=Math.min(maxW,maxH*ratio)*zoom;
  let h=w/ratio;
  if(h>maxH*zoom){h=maxH*zoom;w=h*ratio}
  bookEl.style.width=Math.max(220,w)+'px';
  bookEl.style.height=Math.max(310,h)+'px';
  if(flip) flip.update();
}

async function loadPdfJs(){
  const pdfjs=await import(PDFJS_URL);
  pdfjs.GlobalWorkerOptions.workerSrc=PDF_WORKER;
  return pdfjs;
}

async function makePage(pdfPage,index){
  const page=document.createElement('div');
  page.className='page';
  page.dataset.page=index;
  const canvas=document.createElement('canvas');
  page.appendChild(canvas);
  const base=pdfPage.getViewport({scale:1});
  const target=1200;
  const scale=Math.min(2,Math.max(1,target/base.width));
  const vp=pdfPage.getViewport({scale});
  canvas.width=Math.ceil(vp.width);
  canvas.height=Math.ceil(vp.height);
  await pdfPage.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:vp}).promise;
  return page;
}

async function init(){
 try{
  const pdfjs=await loadPdfJs();
  pdf=await pdfjs.getDocument({url:PDF_FILE}).promise;
  const first=await pdf.getPage(1);
  const v=first.getViewport({scale:1});
  pageWidth=v.width; pageHeight=v.height;

  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const p=await pdf.getPage(i);
    pages.push(await makePage(p,i));
    loading.textContent=`Loading annual report… ${i} / ${pdf.numPages}`;
  }

  bookEl.innerHTML='';
  pages.forEach(p=>bookEl.appendChild(p));
  const width=Math.min(620,Math.max(280,pageWidth));
  const height=width*(pageHeight/pageWidth);

  flip=new window.St.PageFlip(bookEl,{
    width,
    height,
    size:'stretch',
    minWidth:260,
    maxWidth:760,
    minHeight:360,
    maxHeight:1080,
    drawShadow:true,
    maxShadowOpacity:.52,
    showCover:true,
    mobileScrollSupport:false,
    swipeDistance:30,
    flippingTime:720,
    usePortrait:true,
    startPage:0,
    autoSize:true,
    startZIndex:0,
    showPageCorners:true,
    disableFlipByClick:false
  });
  flip.loadFromHTML(pages);
  flip.on('flip',setPageText);
  flip.on('changeState',setPageText);
  flip.on('init',setPageText);
  fitSize();
  setPageText();
  loading.classList.add('hidden');
 }catch(e){
  console.error(e);
  loading.classList.add('hidden');
  error.style.display='flex';
  errorText.textContent='The PDF could not be loaded. Make sure the PDF file is uploaded beside index.html on GitHub Pages.';
 }
}

prev.onclick=()=>flip&&flip.flipPrev('bottom');
next.onclick=()=>flip&&flip.flipNext('bottom');
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft') prev.click();
 if(e.key==='ArrowRight') next.click();
});

document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.45,zoom+.1);fitSize()};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.75,zoom-.1);fitSize()};
document.getElementById('full').onclick=()=>{
 if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
 else document.exitFullscreen?.();
};
window.addEventListener('resize',()=>{fitSize()});
init();
</script>
</body>
</html>
