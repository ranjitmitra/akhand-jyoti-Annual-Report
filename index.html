<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="google" content="notranslate">
<title>Akhand Jyoti — Annual Report 2025–26</title>

<!-- Open-source rendering/flip engines; no Heyzine dependency -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4.1.0/turn.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#f1f1f1;
  font-family:Arial,Helvetica,sans-serif;
  color:#222;
}
#viewport{
  position:fixed;inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f2f2f2;
}
#bookWrap{
  position:relative;
  transform-origin:center center;
  transition:transform .18s ease;
}
#magazine{
  position:relative;
  background:#fff;
}
#magazine .page{
  background:#fff;
  overflow:hidden;
}
#magazine .page img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}
#magazine .page.even{
  box-shadow:inset -18px 0 24px -24px rgba(0,0,0,.55);
}
#magazine .page.odd{
  box-shadow:inset 18px 0 24px -24px rgba(0,0,0,.55);
}

/* magazine gutter */
#gutter{
  position:absolute;
  left:50%;
  top:0;
  width:42px;
  height:100%;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:2000;
  opacity:0;
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(0,0,0,.035) 16%,
    rgba(0,0,0,.10) 35%,
    rgba(0,0,0,.20) 50%,
    rgba(0,0,0,.10) 65%,
    rgba(0,0,0,.035) 84%,
    transparent 100%);
}
#gutter.open{opacity:1}

/* prominent arrows */
.nav{
  position:fixed;
  top:50%;
  width:62px;height:112px;
  transform:translateY(-50%);
  z-index:5000;
  border:1px solid rgba(0,0,0,.12);
  border-radius:12px;
  background:rgba(255,255,255,.88);
  color:#222;
  box-shadow:0 5px 22px rgba(0,0,0,.16);
  font-size:58px;
  font-weight:200;
  line-height:1;
  cursor:pointer;
}
.nav:hover{background:#fff}
.nav:disabled{opacity:.28;cursor:default}
#prev{left:16px}
#next{right:16px}

/* bottom controls */
#controls{
  position:fixed;
  left:50%;bottom:14px;
  transform:translateX(-50%);
  z-index:6000;
  display:flex;align-items:center;gap:5px;
  padding:7px 9px;
  background:rgba(35,35,35,.92);
  border-radius:9px;
  box-shadow:0 8px 28px rgba(0,0,0,.25);
}
.ctrl{
  width:37px;height:33px;
  border:0;border-radius:6px;
  background:#3b3b3b;color:#fff;
  cursor:pointer;
}
.ctrl:hover{background:#505050}
#pageInfo{
  min-width:100px;text-align:center;
  color:#ddd;font-size:12px;
  font-variant-numeric:tabular-nums;
}
#zoomReset{width:50px;font-size:11px}

/* loading */
#loading{
  position:fixed;inset:0;z-index:9000;
  display:flex;align-items:center;justify-content:center;
  background:#f2f2f2;color:#555;
}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid #ddd;border-top-color:#555;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
#error{
  position:fixed;inset:0;z-index:10000;
  display:none;align-items:center;justify-content:center;
  text-align:center;background:#f2f2f2;color:#555;padding:30px;
}
#error strong{display:block;color:#222;font-size:20px;margin-bottom:8px}

@media(max-width:800px){
  .nav{width:48px;height:84px;font-size:44px}
  #prev{left:4px}#next{right:4px}
  #controls{bottom:6px}
}
</style>
</head>

<body>
<div id="viewport">
  <div id="bookWrap">
    <div id="magazine"></div>
    <div id="gutter"></div>
  </div>
</div>

<button id="prev" class="nav" disabled aria-label="Previous page">‹</button>
<button id="next" class="nav" aria-label="Next page">›</button>

<div id="controls">
  <button id="prevCtrl" class="ctrl">‹</button>
  <div id="pageInfo">Cover</div>
  <button id="nextCtrl" class="ctrl">›</button>
  <button id="zoomOut" class="ctrl">−</button>
  <button id="zoomReset" class="ctrl">100%</button>
  <button id="zoomIn" class="ctrl">+</button>
  <button id="full" class="ctrl">⛶</button>
</div>

<div id="loading">
  <div>
    <div class="spinner"></div>
    <div id="loadingText">Opening annual report…</div>
  </div>
</div>

<div id="error">
  <div>
    <strong>Unable to open the annual report</strong>
    <div id="errorText"></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const PDF_FILE = "./Annual%20report%2025-26_V2.pdf";

let pdf=null, total=0, images=[];
let zoom=1;
let firstOpen=false;
let animating=false;
let pageW=596, pageH=842;

/*
  The original supplied Heyzine configuration specifies:
  MAGAZINE viewer, shadow, depth, center, zoom, and arrows.
  This implementation uses the same magazine model but hosts
  the PDF locally and does not call Heyzine.
*/

const $mag = $("#magazine");
const $wrap = $("#bookWrap");
const $gutter = $("#gutter");

function setText(t){$("#loadingText").text(t)}

function fit(){
  const ratio=pageW/pageH;
  const maxH=Math.min(innerHeight*.82,900);
  const maxW=Math.min(innerWidth*.82,1280);
  let h=maxH, w=h*ratio*2;
  if(w>maxW){w=maxW;h=w/(ratio*2)}
  $wrap.css({width:w+"px",height:h+"px"});
  $mag.css({width:w+"px",height:h+"px"});
  if(firstOpen) {
    try{$mag.turn("size",w/2,h)}catch(e){}
  } else {
    try{$mag.turn("size",w/2,h)}catch(e){}
  }
  applyZoom();
}

function applyZoom(){
  $wrap.css("transform",`scale(${zoom})`);
  $("#zoomReset").text(Math.round(zoom*100)+"%");
}

function renderPage(n, scale=1.45){
  return pdf.getPage(n).then(p=>{
    const vp=p.getViewport({scale});
    const c=document.createElement("canvas");
    c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const ctx=c.getContext("2d",{alpha:false});
    return p.render({canvasContext:ctx,viewport:vp}).promise.then(
      ()=>c.toDataURL("image/jpeg",.94)
    );
  });
}

function addPages(){
  $mag.empty();
  images.forEach((src,i)=>{
    const d=$("<div/>",{
      class:"page "+(i%2?"odd":"even")
    });
    $("<img/>",{src:src,draggable:false}).appendTo(d);
    d.appendTo($mag);
  });
}

function updateUI(){
  let p=1;
  try{p=$mag.turn("page")}catch(e){}
  const end=total;

  const atStart=p<=1;
  const atEnd=p>=end;

  $("#prev,#prevCtrl").prop("disabled",atStart);
  $("#next,#nextCtrl").prop("disabled",atEnd);

  if(p<=1) $("#pageInfo").text("Cover");
  else if(p>=end) $("#pageInfo").text("Back cover");
  else {
    const left=p%2===0?p:p-1;
    $("#pageInfo").text(`${left}–${Math.min(left+1,end)} / ${end}`);
  }

  $gutter.toggleClass("open",p>1 && p<end);
}

function createBook(){
  const w=$wrap.width(), h=$wrap.height();

  /*
    The initial cover is centered as a single page.
    Once the first turn completes, the same page object
    switches to the two-page magazine presentation.
  */
  $mag.turn({
    width:w,
    height:h,
    display:"single",
    acceleration:true,
    gradients:true,
    elevation:60,
    duration:850,
    autoCenter:true,
    pages:total,
    direction:"ltr",
    when:{
      turning:function(e,page){
        if(animating) return;
        const current=$mag.turn("page");

        /* after the cover, let the magazine become a spread */
        if(current===1 && page===2){
          animating=true;
          setTimeout(()=>{
            firstOpen=true;
            try{
              $mag.turn("display","double");
              $mag.turn("page",2);
            }catch(err){}
            animating=false;
            updateUI();
          },20);
        }
      },
      turned:function(e,page){
        updateUI();
      }
    }
  });

  updateUI();
}

async function start(){
  try{
    const r=await fetch(PDF_FILE,{cache:"no-store"});
    if(!r.ok) throw new Error("PDF returned HTTP "+r.status);
    const buf=await r.arrayBuffer();

    setText("Reading annual report…");
    pdf=await pdfjsLib.getDocument({data:buf}).promise;
    total=pdf.numPages;

    const first=await pdf.getPage(1);
    const vp=first.getViewport({scale:1});
    pageW=vp.width; pageH=vp.height;

    for(let i=1;i<=total;i++){
      setText(`Preparing page ${i} of ${total}…`);
      images.push(await renderPage(i));
    }

    addPages();
    createBook();
    fit();

    $("#loading").fadeOut(300);
  }catch(e){
    console.error(e);
    $("#loading").hide();
    $("#errorText").text(e.message||"Unable to load the PDF.");
    $("#error").css("display","flex");
  }
}

/* Navigation */
function nextPage(){
  if(animating) return;
  try{$mag.turn("next")}catch(e){}
}
function prevPage(){
  if(animating) return;
  try{$mag.turn("previous")}catch(e){}
}
$("#next,#nextCtrl").on("click",nextPage);
$("#prev,#prevCtrl").on("click",prevPage);

/* Keyboard */
$(document).on("keydown",e=>{
  if(e.key==="ArrowRight") nextPage();
  if(e.key==="ArrowLeft") prevPage();
});

/* Zoom */
$("#zoomIn").on("click",()=>{
  zoom=Math.min(1.5,zoom+.1); applyZoom();
});
$("#zoomOut").on("click",()=>{
  zoom=Math.max(.75,zoom-.1); applyZoom();
});
$("#zoomReset").on("click",()=>{
  zoom=1; applyZoom();
});

/* Fullscreen */
$("#full").on("click",async()=>{
  try{
    if(!document.fullscreenElement)
      await document.documentElement.requestFullscreen();
    else
      await document.exitFullscreen();
  }catch(e){}
});

window.addEventListener("resize",fit);
start();
</script>
</body>
</html>
