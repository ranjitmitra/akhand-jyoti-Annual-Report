<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Akhand Jyoti — Annual Report 2025–26</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#f3f3f3;
  font-family:Arial,Helvetica,sans-serif;
}
#reader{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#bookWrap{
  position:relative;
  width:min(88vw,1280px);
  height:min(86vh,900px);
  display:flex;
  align-items:center;
  justify-content:center;
}
#book{
  position:relative;
  margin:auto;
}
.page{
  background:#fff;
  overflow:hidden;
}
.page img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}
#book.spread:after{
  content:"";
  position:absolute;
  top:0;bottom:0;left:50%;
  width:38px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:20;
  background:linear-gradient(90deg,
    transparent,
    rgba(0,0,0,.035) 20%,
    rgba(0,0,0,.16) 50%,
    rgba(0,0,0,.035) 80%,
    transparent);
}

/* The gutter must NEVER sit on top of the page that is turning. */
#book.flipping:after{
  opacity:0 !important;
}
.nav{
  position:fixed;top:50%;
  transform:translateY(-50%);
  z-index:1000;
  width:60px;height:112px;
  border:0;border-radius:12px;
  background:rgba(35,35,35,.82);
  color:#fff;
  font-size:56px;font-weight:200;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.nav:hover{background:rgba(20,20,20,.95)}
.nav:disabled{opacity:.2;pointer-events:none}
#prevEdge{left:18px}
#nextEdge{right:18px}
#controls{
  position:fixed;left:50%;bottom:14px;
  transform:translateX(-50%);
  z-index:1100;
  display:flex;align-items:center;gap:5px;
  padding:7px 8px;
  background:rgba(35,35,35,.92);
  border-radius:9px;
}
.ctrl{
  width:38px;height:34px;
  border:0;border-radius:6px;
  background:#3b3b3b;color:#fff;
  cursor:pointer;
}
.ctrl:hover{background:#505050}
#info{
  min-width:100px;text-align:center;
  color:#ddd;font-size:12px;
}
#zoomReset{width:48px;font-size:11px}
#loading{
  position:fixed;inset:0;z-index:5000;
  display:flex;align-items:center;justify-content:center;
  background:#f3f3f3;color:#555;
}
.loader{text-align:center;font-size:13px}
.spin{
  width:34px;height:34px;
  margin:0 auto 12px;
  border:3px solid #ddd;
  border-top-color:#555;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#error{
  position:fixed;inset:0;z-index:6000;
  display:none;align-items:center;justify-content:center;
  background:#f3f3f3;color:#333;text-align:center;
  padding:30px;
}
#error strong{display:block;font-size:20px;margin-bottom:8px}
@media(max-width:800px){
  #bookWrap{width:94vw;height:80vh}
  .nav{width:46px;height:86px;font-size:43px}
  #prevEdge{left:5px}#nextEdge{right:5px}
}
</style>
</head>

<body>
<div id="reader"><div id="book"></div></div>

<button id="prevEdge" class="nav" disabled aria-label="Previous">‹</button>
<button id="nextEdge" class="nav" aria-label="Next">›</button>

<div id="controls">
  <button id="prev" class="ctrl">‹</button>
  <div id="info">Cover</div>
  <button id="next" class="ctrl">›</button>
  <button id="zoomOut" class="ctrl">−</button>
  <button id="zoomReset" class="ctrl">100%</button>
  <button id="zoomIn" class="ctrl">+</button>
  <button id="full" class="ctrl">⛶</button>
</div>

<div id="loading">
  <div class="loader">
    <div class="spin"></div>
    <div id="loadText">Opening annual report…</div>
  </div>
</div>

<div id="error">
  <div>
    <strong>Unable to open the annual report</strong>
    <div id="errorText"></div>
  </div>
</div>

<script>
(function(){

  const PDF_FILE = "./Annual%20report%2025-26_V2.pdf";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const book = document.getElementById("book");
  const loading = document.getElementById("loading");
  const loadText = document.getElementById("loadText");
  const errorBox = document.getElementById("error");
  const errorText = document.getElementById("errorText");
  const info = document.getElementById("info");

  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const prevEdge = document.getElementById("prevEdge");
  const nextEdge = document.getElementById("nextEdge");

  let flip = null;
  let total = 0;
  let zoom = 1;

  function fail(message){
    console.error(message);
    loading.style.display = "none";
    errorText.textContent = message;
    errorBox.style.display = "flex";
  }

  function renderPage(pageNumber){
    return pdfjsLib.getDocument(PDF_FILE).promise;
  }

  async function pageImage(pdfDoc, n){
    const page = await pdfDoc.getPage(n);
    const base = page.getViewport({scale:1});
    const targetWidth = 900;
    const scale = targetWidth / base.width;
    const viewport = page.getViewport({scale:scale});

    const canvas = document.createElement("canvas");
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    const ctx = canvas.getContext("2d", {alpha:false});
    await page.render({
      canvasContext:ctx,
      viewport:viewport
    }).promise;

    return {
      src:canvas.toDataURL("image/jpeg",.94),
      width:base.width,
      height:base.height
    };
  }

  function addPage(src, index){
    const el = document.createElement("div");
    el.className = "page";
    el.dataset.page = index + 1;

    const img = document.createElement("img");
    img.src = src;
    img.alt = "Annual Report page " + (index + 1);
    img.draggable = false;

    el.appendChild(img);
    book.appendChild(el);
  }

  function update(index){
    if(index <= 0){
      info.textContent = "Cover";
    }else if(index >= total-1){
      info.textContent = "Back cover";
    }else{
      const a = index + 1;
      const b = Math.min(index + 2,total);
      info.textContent = a + "–" + b + " / " + total;
    }

    const first = index <= 0;
    const last = index >= total-1;

    prev.disabled = first;
    prevEdge.disabled = first;
    next.disabled = last;
    nextEdge.disabled = last;

    book.classList.toggle("spread",index > 0 && index < total-1);
  }

  function goNext(){
    if(flip) flip.flipNext("bottom");
  }

  function goPrev(){
    if(flip) flip.flipPrev("bottom");
  }

  prev.onclick = goPrev;
  prevEdge.onclick = goPrev;
  next.onclick = goNext;
  nextEdge.onclick = goNext;

  document.addEventListener("keydown",function(e){
    if(e.key === "ArrowRight") goNext();
    if(e.key === "ArrowLeft") goPrev();
  });

  document.getElementById("zoomIn").onclick=function(){
    zoom=Math.min(1.45,zoom+.1);
    book.style.transform="scale("+zoom+")";
    document.getElementById("zoomReset").textContent=Math.round(zoom*100)+"%";
  };

  document.getElementById("zoomOut").onclick=function(){
    zoom=Math.max(.75,zoom-.1);
    book.style.transform="scale("+zoom+")";
    document.getElementById("zoomReset").textContent=Math.round(zoom*100)+"%";
  };

  document.getElementById("zoomReset").onclick=function(){
    zoom=1;
    book.style.transform="scale(1)";
    this.textContent="100%";
  };

  document.getElementById("full").onclick=async function(){
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }else{
        await document.exitFullscreen();
      }
    }catch(e){}
  };

  async function start(){

    if(!window.pdfjsLib){
      fail("PDF.js failed to load. Check your internet connection.");
      return;
    }

    if(!window.St || !window.St.PageFlip){
      fail("PageFlip failed to load. Check your internet connection.");
      return;
    }

    try{
      loadText.textContent="Loading PDF…";

      const response = await fetch(PDF_FILE,{cache:"no-store"});
      if(!response.ok){
        throw new Error(
          "The PDF could not be found. Make sure the filename is exactly: Annual report 25-26_V2.pdf"
        );
      }

      const buffer = await response.arrayBuffer();

      const pdfDoc = await pdfjsLib.getDocument({
        data:buffer
      }).promise;

      total = pdfDoc.numPages;

      if(total < 2){
        throw new Error("The PDF must contain at least two pages.");
      }

      const first = await pdfDoc.getPage(1);
      const viewport = first.getViewport({scale:1});

      for(let i=1;i<=total;i++){
        loadText.textContent =
          "Preparing page " + i + " of " + total + "…";

        const result = await pageImage(pdfDoc,i);
        addPage(result.src,i-1);
      }

      const pages = book.querySelectorAll(".page");

      flip = new St.PageFlip(book,{
        width:viewport.width,
        height:viewport.height,

        size:"stretch",

        minWidth:280,
        maxWidth:900,
        minHeight:396,
        maxHeight:1300,

        showCover:true,

        drawShadow:true,
        maxShadowOpacity:.38,

        flippingTime:850,

        usePortrait:true,

        autoSize:true,

        mobileScrollSupport:false,

        swipeDistance:30,

        showPageCorners:true,

        disableFlipByClick:false
      });

      flip.loadFromHTML(pages);

      /*
        Keep the center gutter hidden while the physical page is
        rotating. It returns only after the turn is complete.
      */
      let gutterTimer = null;

      function hideGutterDuringTurn(){
        book.classList.add("flipping");
        clearTimeout(gutterTimer);
      }

      function restoreGutterAfterTurn(){
        clearTimeout(gutterTimer);
        gutterTimer = setTimeout(function(){
          book.classList.remove("flipping");
        }, 80);
      }

      flip.on("flip",function(e){
        hideGutterDuringTurn();
        update(e.data);
        restoreGutterAfterTurn();
      });

      flip.on("changeState",function(e){
        if(e && e.data === "flipping"){
          hideGutterDuringTurn();
        }else{
          restoreGutterAfterTurn();
        }
      });

      flip.on("changeOrientation",function(){
        update(flip.getCurrentPageIndex());
      });

      update(0);

      loading.style.opacity="0";
      setTimeout(function(){
        loading.style.display="none";
      },300);

    }catch(err){
      console.error(err);
      fail(err.message || "The viewer could not be initialized.");
    }
  }

  start();

})();
</script>
</body>
</html>
