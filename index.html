<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akhand Jyoti — Annual Report 2025–26</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at center,#414141 0%,#292929 38%,#151515 78%,#0d0d0d 100%);font-family:Arial,Helvetica,sans-serif;color:#fff}
#reader{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#bookArea{position:relative;width:min(94vw,1200px);height:min(86vh,900px);display:flex;align-items:center;justify-content:center}
#book{width:100%;height:100%;position:relative}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;display:block;object-fit:contain;background:#fff;user-select:none;-webkit-user-drag:none}

/* Open-book gutter. It sits under the page-flip layer, so it looks like a real binding. */
#gutter{position:absolute;z-index:120;top:0;bottom:0;left:50%;width:44px;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .12s}
#gutter:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.055) 18%,rgba(0,0,0,.20) 38%,rgba(0,0,0,.32) 50%,rgba(0,0,0,.20) 62%,rgba(0,0,0,.055) 82%,rgba(0,0,0,0))}
#gutter:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);background:rgba(0,0,0,.18)}
#gutter.show{opacity:1}

/* Cover mode is a separate full-page physical sheet. It uses the same 3D page-turn
   direction and duration as the interior engine, rather than StPageFlip's hard-cover mode. */
#coverStage{position:absolute;z-index:400;inset:0;display:block;pointer-events:none}
#coverSheet{position:absolute;top:50%;left:50%;height:100%;width:auto;aspect-ratio:1/1.414;max-width:50%;transform:translate(-50%,-50%);}
#coverSheet{background:#fff;box-shadow:0 18px 42px rgba(0,0,0,.45);transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
#coverSheet img{width:100%;height:100%;object-fit:contain;display:block}
#coverSheet:after{content:"";position:absolute;top:0;bottom:0;right:0;width:20%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.20));opacity:.25;pointer-events:none}
#coverSheet.turnForward{animation:coverForward .78s cubic-bezier(.22,.72,.28,1) forwards}
#coverSheet.turnBack{animation:coverBack .78s cubic-bezier(.22,.72,.28,1) forwards}
@keyframes coverForward{
  0%{transform:translate(-50%,-50%) perspective(1800px) rotateY(0deg);filter:brightness(1)}
  42%{transform:translate(-50%,-50%) perspective(1800px) rotateY(62deg);filter:brightness(.90)}
  100%{transform:translate(-100%,-50%) perspective(1800px) rotateY(180deg);filter:brightness(.72)}
}
@keyframes coverBack{
  0%{transform:translate(-100%,-50%) perspective(1800px) rotateY(180deg);filter:brightness(.72)}
  58%{transform:translate(-50%,-50%) perspective(1800px) rotateY(62deg);filter:brightness(.90)}
  100%{transform:translate(-50%,-50%) perspective(1800px) rotateY(0deg);filter:brightness(1)}
}
#coverStage.hidden{display:none}

#title{position:fixed;z-index:800;top:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:rgba(255,255,255,.78);white-space:nowrap;pointer-events:none}
.edge{position:fixed;z-index:900;top:50%;transform:translateY(-50%);width:62px;height:118px;border:0;border-radius:14px;background:rgba(18,18,18,.78);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 25px rgba(0,0,0,.38);backdrop-filter:blur(8px);transition:.18s}
.edge:hover{background:rgba(48,48,48,.95)}.edge:active{transform:translateY(-50%) scale(.95)}
.edge span{font-size:58px;font-weight:200;line-height:1}
#prevEdge{left:16px}#nextEdge{right:16px}.edge.disabled{opacity:.18;pointer-events:none}
#controls{position:fixed;z-index:950;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:12px;background:rgba(24,24,24,.9);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.42);backdrop-filter:blur(12px)}
.ctrl{width:38px;height:35px;border:1px solid rgba(255,255,255,.13);border-radius:7px;background:#303030;color:#fff;cursor:pointer;font-size:17px}.ctrl:hover{background:#414141}.ctrl:disabled{opacity:.35;cursor:not-allowed}
#info{min-width:96px;text-align:center;font-size:12px;color:#ddd;font-variant-numeric:tabular-nums}#zoomLabel{width:48px;font-size:11px}
#hint{position:fixed;z-index:800;right:16px;bottom:20px;color:rgba(255,255,255,.38);font-size:11px}
#loading{position:fixed;inset:0;z-index:1200;background:#151515;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.loader{text-align:center;color:#ddd;font-size:13px}.spinner{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;position:fixed;inset:0;z-index:1300;align-items:center;justify-content:center;text-align:center;background:#151515;color:#ccc;padding:30px}.errorTitle{color:#fff}
@media(max-width:850px){#bookArea{width:100vw;height:82vh}.edge{width:48px;height:92px}.edge span{font-size:44px}#prevEdge{left:5px}#nextEdge{right:5px}#hint{display:none}}
@media(max-width:520px){#controls{bottom:7px}.ctrl{width:34px;height:33px}#info{min-width:76px}#title{font-size:11px;max-width:88%;overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<div id="reader">
 <div id="bookArea">
  <div id="book"></div>
  <div id="gutter"></div>
  <div id="coverStage"><div id="coverSheet"><img id="coverImg" alt="Annual Report cover"></div></div>
 </div>
</div>
<div id="title">Akhand Jyoti — Annual Report 2025–26</div>
<button id="prevEdge" class="edge disabled"><span>‹</span></button>
<button id="nextEdge" class="edge"><span>›</span></button>
<div id="controls">
 <button id="prev" class="ctrl">‹</button><div id="info">Cover</div><button id="next" class="ctrl">›</button>
 <button id="zoomOut" class="ctrl">−</button><button id="zoomLabel" class="ctrl">100%</button><button id="zoomIn" class="ctrl">+</button><button id="full" class="ctrl">⛶</button>
</div>
<div id="hint">Drag a page corner or use the arrows</div>
<div id="loading"><div class="loader"><div class="spinner"></div><div id="loadingText">Opening annual report…</div></div></div>
<div id="error"><div><h3 class="errorTitle">Unable to open the annual report</h3><p id="errorText"></p></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const PDF_FILE="Annual%20report%2025-26_V2.pdf";
const book=document.getElementById("book"),gutter=document.getElementById("gutter");
const coverStage=document.getElementById("coverStage"),coverSheet=document.getElementById("coverSheet"),coverImg=document.getElementById("coverImg");
const loading=document.getElementById("loading"),loadingText=document.getElementById("loadingText"),errorBox=document.getElementById("error"),errorText=document.getElementById("errorText");
const info=document.getElementById("info"),prev=document.getElementById("prev"),next=document.getElementById("next"),prevEdge=document.getElementById("prevEdge"),nextEdge=document.getElementById("nextEdge");
const zoomIn=document.getElementById("zoomIn"),zoomOut=document.getElementById("zoomOut"),zoomLabel=document.getElementById("zoomLabel"),full=document.getElementById("full");
let pdf=null,total=0,flip=null,zoom=1,current=0,coverAnimating=false,images=[];

function setLoading(t){loadingText.textContent=t}
function showError(t){loading.style.display="none";errorText.textContent=t;errorBox.style.display="flex"}
function makePage(src,index){const d=document.createElement("div");d.className="page"; if(src){const i=document.createElement("img");i.src=src;i.alt="Annual Report page "+(index+1);d.appendChild(i)} book.appendChild(d)}
async function renderPage(n){const p=await pdf.getPage(n),v=p.getViewport({scale:1.35}),c=document.createElement("canvas"),ctx=c.getContext("2d",{alpha:false});c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);await p.render({canvasContext:ctx,viewport:v}).promise;return c.toDataURL("image/jpeg",.90)}
function updateNav(i){
 current=i;
 const start=i===0,end=i===total-1;
 info.textContent=start?"Cover":end?"Back cover":((i+1)+"–"+Math.min(i+2,total-1)+" / "+total);
 prev.disabled=start;next.disabled=end;prevEdge.classList.toggle("disabled",start);nextEdge.classList.toggle("disabled",end);
 if(!start&&!end&&!coverAnimating)gutter.classList.add("show");else gutter.classList.remove("show");
}
function beginCoverForward(){
 if(coverAnimating||current!==0)return;
 coverAnimating=true;gutter.classList.remove("show");
 coverSheet.classList.remove("turnBack");void coverSheet.offsetWidth;coverSheet.classList.add("turnForward");
 setTimeout(()=>{coverStage.classList.add("hidden");coverSheet.classList.remove("turnForward");flip.turnToPage(0);updateNav(1);gutter.classList.add("show");coverAnimating=false},790);
}
function beginCoverBack(){
 if(coverAnimating||current!==1)return;
 coverAnimating=true;gutter.classList.remove("show");
 coverStage.classList.remove("hidden");coverSheet.classList.remove("turnForward");void coverSheet.offsetWidth;coverSheet.classList.add("turnBack");
 setTimeout(()=>{coverSheet.classList.remove("turnBack");flip.turnToPage(0);updateNav(0);coverAnimating=false},790);
}
function goNext(){if(coverAnimating)return;if(current===0){beginCoverForward();return}if(current===total-1)return;flip.flipNext("bottom")}
function goPrev(){if(coverAnimating)return;if(current===1){beginCoverBack();return}if(current<=0)return;if(current===total-1){flip.flipPrev("bottom");return}flip.flipPrev("bottom")}
prev.onclick=goPrev;prevEdge.onclick=goPrev;next.onclick=goNext;nextEdge.onclick=goNext;
function setZoom(){book.style.transform="scale("+zoom+")";gutter.style.transform="translateX(-50%) scaleY("+zoom+")";zoomLabel.textContent=Math.round(zoom*100)+"%"}
zoomIn.onclick=()=>{zoom=Math.min(1.5,zoom+.1);setZoom()};zoomOut.onclick=()=>{zoom=Math.max(.8,zoom-.1);setZoom()};zoomLabel.onclick=()=>{zoom=1;setZoom()};
full.onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.()};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="PageDown")goNext();if(e.key==="ArrowLeft"||e.key==="PageUp")goPrev();if(e.key==="+")zoomIn.click();if(e.key==="-")zoomOut.click();if(e.key==="0")zoomLabel.click()});

async function start(){
 try{
  setLoading("Loading PDF…");const r=await fetch(PDF_FILE,{cache:"no-store"});if(!r.ok)throw new Error("PDF request returned HTTP "+r.status);
  pdf=await pdfjsLib.getDocument({data:await r.arrayBuffer()}).promise;total=pdf.numPages;
  for(let n=1;n<=total;n++){setLoading("Preparing page "+n+" of "+total+"…");images.push(await renderPage(n))}
  coverImg.src=images[0];
  // Interior engine uses pages 2..82 only. This removes the problematic showCover
  // state machine that was repeatedly snapping back to the cover.
  makePage("", -1);
  for(let i=1;i<total;i++)makePage(images[i],i);
  const size=(await pdf.getPage(1)).getViewport({scale:1});
  flip=new St.PageFlip(book,{width:size.width,height:size.height,size:"stretch",minWidth:280,maxWidth:1000,minHeight:396,maxHeight:1350,drawShadow:true,maxShadowOpacity:.46,flippingTime:780,usePortrait:true,showCover:false,autoSize:true,mobileScrollSupport:false,swipeDistance:30,useMouseEvents:true,disableFlipByClick:false,startPage:0});
  flip.loadFromHTML(book.querySelectorAll(".page"));
  flip.on("flip",e=>{const interior=e.data;updateNav(Math.min(total-1, Math.max(1, interior+1)))});
  flip.on("changeOrientation",()=>{if(!coverAnimating)updateNav(Math.min(total-1, Math.max(1, flip.getCurrentPageIndex()+1)))});
  updateNav(0);
  loading.style.opacity="0";setTimeout(()=>loading.style.display="none",350)
 }catch(e){console.error(e);showError("The viewer could not load the PDF. "+(e.message||"Unknown error."))}
}
start();
</script>
</body>
</html>
