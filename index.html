<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akhand Jyoti — Annual Report 2025–26</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.8/dist/js/page-flip.browser.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            ellipse at center,
            #414141 0%,
            #2b2b2b 38%,
            #191919 72%,
            #0d0d0d 100%
        );
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

/* =========================================================
   READER
========================================================= */

#reader{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

#bookArea{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    transform-origin:center center;

    transition:transform .18s ease;
}

/*
   PageFlip itself controls the book geometry.
   Do NOT position individual covers manually.
*/

#flipbook{
    position:relative;

    margin:0;
    padding:0;

    visibility:hidden;
    opacity:0;
}

#flipbook.ready{
    visibility:visible;
}

#flipbook.visible{
    opacity:1;
}


/* =========================================================
   PDF PAGE
========================================================= */

.page{
    position:relative;

    background:#fff;

    overflow:hidden;

    margin:0;
    padding:0;

    backface-visibility:hidden;

    -webkit-backface-visibility:hidden;
}

.page img{
    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#fff;

    margin:0;
    padding:0;

    user-select:none;
    -webkit-user-drag:none;
}


/* =========================================================
   VERY SUBTLE BOOK BACKDROP
========================================================= */

#bookShadow{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(0,0,0,0);

    box-shadow:
        0 25px 55px rgba(0,0,0,.38);

    pointer-events:none;

    opacity:0;

    transition:opacity .3s ease;
}

#bookShadow.visible{
    opacity:1;
}


/* =========================================================
   CENTER SPINE SHADOW

   This is ONLY visible on a genuine open spread.
   PageFlip supplies the moving page shadows.
========================================================= */

#spine{
    position:absolute;

    left:50%;
    top:0;

    width:32px;
    height:100%;

    transform:translateX(-50%);

    pointer-events:none;

    z-index:50;

    opacity:0;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0,0,0,.025) 12%,
            rgba(0,0,0,.09) 28%,
            rgba(0,0,0,.18) 43%,
            rgba(0,0,0,.26) 50%,
            rgba(0,0,0,.18) 57%,
            rgba(0,0,0,.09) 72%,
            rgba(0,0,0,.025) 88%,
            transparent 100%
        );

    transition:
        opacity .2s ease;
}

#spine.visible{
    opacity:1;
}

#spine::after{
    content:"";

    position:absolute;

    left:50%;
    top:0;

    width:1px;
    height:100%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.14);
}


/* =========================================================
   TITLE
========================================================= */

#title{
    position:fixed;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    color:rgba(255,255,255,.72);

    font-size:13px;
    font-weight:600;

    white-space:nowrap;

    pointer-events:none;
}


/* =========================================================
   LARGE PREVIOUS / NEXT
========================================================= */

.nav{
    position:fixed;

    top:50%;

    transform:translateY(-50%);

    z-index:1200;

    width:62px;
    height:112px;

    border:1px solid rgba(255,255,255,.13);

    border-radius:14px;

    background:rgba(18,18,18,.84);

    color:#fff;

    box-shadow:
        0 8px 25px rgba(0,0,0,.4);

    backdrop-filter:blur(8px);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        background .18s ease,
        opacity .18s ease,
        transform .18s ease;
}

.nav:hover{
    background:rgba(50,50,50,.96);
}

.nav:active{
    transform:
        translateY(-50%)
        scale(.94);
}

.nav span{
    font-size:58px;
    font-weight:200;
    line-height:1;

    margin-top:-5px;
}

#previous{
    left:15px;
}

#next{
    right:15px;
}

.nav.disabled{
    opacity:.18;
    pointer-events:none;
}


/* =========================================================
   CONTROL BAR
========================================================= */

#controls{
    position:fixed;

    left:50%;
    bottom:13px;

    transform:translateX(-50%);

    z-index:1300;

    display:flex;
    align-items:center;

    gap:6px;

    padding:7px 9px;

    background:rgba(23,23,23,.93);

    border:1px solid rgba(255,255,255,.14);

    border-radius:11px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);

    backdrop-filter:blur(12px);
}

.control{
    width:38px;
    height:35px;

    padding:0;

    border-radius:7px;

    border:1px solid rgba(255,255,255,.12);

    background:#303030;

    color:#fff;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
}

.control:hover{
    background:#414141;
}

.control:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#pageInfo{
    min-width:105px;

    text-align:center;

    color:#ddd;

    font-size:12px;

    font-variant-numeric:tabular-nums;
}

#zoomReset{
    width:48px;

    font-size:11px;
}


/* =========================================================
   HINT
========================================================= */

#hint{
    position:fixed;

    right:15px;
    bottom:20px;

    z-index:1000;

    color:rgba(255,255,255,.34);

    font-size:11px;

    pointer-events:none;
}


/* =========================================================
   LOADING
========================================================= */

#loading{
    position:fixed;

    inset:0;

    z-index:3000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#151515;

    transition:opacity .35s ease;
}

.loader{
    text-align:center;

    color:#ddd;

    font-size:13px;
}

.spinner{
    width:34px;
    height:34px;

    margin:0 auto 14px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.17);

    border-top-color:#fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

#error{
    position:fixed;

    inset:0;

    z-index:4000;

    display:none;

    align-items:center;
    justify-content:center;

    background:#151515;

    color:#ccc;

    text-align:center;

    padding:30px;
}

#error h2{
    color:#fff;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .nav{
        width:48px;
        height:88px;
    }

    .nav span{
        font-size:44px;
    }

    #previous{
        left:4px;
    }

    #next{
        right:4px;
    }

    #hint{
        display:none;
    }

}

@media(max-width:520px){

    #title{
        font-size:11px;
        max-width:90vw;

        overflow:hidden;
        text-overflow:ellipsis;
    }

    #controls{
        bottom:6px;
    }

    .control{
        width:34px;
        height:32px;
    }

    #pageInfo{
        min-width:72px;
        font-size:11px;
    }

    #zoomReset{
        width:44px;
    }

}
</style>
</head>

<body>


<!-- ======================================================
     READER
====================================================== -->

<div id="reader">

    <div id="bookArea">

        <div id="bookShadow"></div>

        <!--
            IMPORTANT:

            The COMPLETE PDF is placed here.

            Page 1  = real front cover
            Page 2+ = interior
            Last    = real back cover

            PageFlip handles the entire book.
        -->

        <div id="flipbook"></div>

        <div id="spine"></div>

    </div>

</div>


<!-- ======================================================
     TITLE
====================================================== -->

<div id="title">
    Akhand Jyoti — Annual Report 2025–26
</div>


<!-- ======================================================
     LARGE NAVIGATION
====================================================== -->

<button
    id="previous"
    class="nav disabled"
    aria-label="Previous page"
    title="Previous page"
>
    <span>‹</span>
</button>

<button
    id="next"
    class="nav"
    aria-label="Next page"
    title="Next page"
>
    <span>›</span>
</button>


<!-- ======================================================
     CONTROL BAR
====================================================== -->

<div id="controls">

    <button
        id="previousControl"
        class="control"
        title="Previous page"
    >
        ‹
    </button>

    <div id="pageInfo">
        Cover
    </div>

    <button
        id="nextControl"
        class="control"
        title="Next page"
    >
        ›
    </button>

    <button
        id="zoomOut"
        class="control"
        title="Zoom out"
    >
        −
    </button>

    <button
        id="zoomReset"
        class="control"
        title="Reset zoom"
    >
        100%
    </button>

    <button
        id="zoomIn"
        class="control"
        title="Zoom in"
    >
        +
    </button>

    <button
        id="fullscreen"
        class="control"
        title="Fullscreen"
    >
        ⛶
    </button>

</div>


<div id="hint">
    Drag the page corner or use the arrows
</div>


<!-- ======================================================
     LOADING
====================================================== -->

<div id="loading">

    <div class="loader">

        <div class="spinner"></div>

        <div id="loadingText">
            Opening annual report…
        </div>

    </div>

</div>


<!-- ======================================================
     ERROR
====================================================== -->

<div id="error">

    <div>

        <h2>
            Unable to open the annual report
        </h2>

        <p id="errorText"></p>

    </div>

</div>


<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   YOUR FIXED PDF

   Keep this PDF in the SAME folder as index.html.
========================================================= */

const PDF_FILE =
    "Annual report 25-26_V2.pdf";


/* =========================================================
   DOM
========================================================= */

const bookArea =
    document.getElementById("bookArea");

const bookShadow =
    document.getElementById("bookShadow");

const flipbook =
    document.getElementById("flipbook");

const spine =
    document.getElementById("spine");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const previousControl =
    document.getElementById("previousControl");

const nextControl =
    document.getElementById("nextControl");

const pageInfo =
    document.getElementById("pageInfo");

const zoomIn =
    document.getElementById("zoomIn");

const zoomOut =
    document.getElementById("zoomOut");

const zoomReset =
    document.getElementById("zoomReset");

const fullscreen =
    document.getElementById("fullscreen");


/* =========================================================
   STATE
========================================================= */

let pdf = null;

let pageFlip = null;

let totalPages = 0;

let zoom = 1;

let pageWidth = 0;

let pageHeight = 0;


/* =========================================================
   LOADING MESSAGE
========================================================= */

function setLoading(message){

    loadingText.textContent =
        message;

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    loading.style.display =
        "none";

    errorText.textContent =
        message;

    errorBox.style.display =
        "flex";

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPDFPage(
    pageNumber,
    scale
){

    const page =
        await pdf.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale:scale
        });


    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    canvas.width =
        Math.ceil(
            viewport.width
        );

    canvas.height =
        Math.ceil(
            viewport.height
        );


    await page.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    return canvas.toDataURL(
        "image/jpeg",
        .93
    );

}


/* =========================================================
   CREATE PDF PAGE

   FIRST + LAST = HARD

   Everything between = SOFT
========================================================= */

function createPage(
    imageURL,
    pageNumber
){

    const page =
        document.createElement(
            "div"
        );

    page.className =
        "page";


    if(
        pageNumber === 1 ||
        pageNumber === totalPages
    ){

        page.dataset.density =
            "hard";

    }else{

        page.dataset.density =
            "soft";

    }


    const image =
        document.createElement(
            "img"
        );


    image.src =
        imageURL;

    image.alt =
        "Annual Report page " +
        pageNumber;

    image.draggable =
        false;


    page.appendChild(
        image
    );


    flipbook.appendChild(
        page
    );

}


/* =========================================================
   CALCULATE THE REAL BOOK SIZE

   IMPORTANT:
   We use FIXED sizing rather than stretching the book.
   This prevents the cover from becoming offset or
   distorted during the transition.
========================================================= */

function calculateBookSize(){

    const ratio =
        pageWidth /
        pageHeight;


    const maxHeight =
        Math.min(
            window.innerHeight * .82,
            900
        );


    const maxBookWidth =
        Math.min(
            window.innerWidth * .82,
            1250
        );


    let height =
        maxHeight;


    let width =
        height *
        ratio *
        2;


    if(width > maxBookWidth){

        width =
            maxBookWidth;

        height =
            width /
            (ratio * 2);

    }


    /*
       The dimensions are applied to the OUTER book only.

       No page is manually translated.
    */

    bookArea.style.width =
        Math.round(width) +
        "px";

    bookArea.style.height =
        Math.round(height) +
        "px";

}


/* =========================================================
   UPDATE NAVIGATION
========================================================= */

function updateNavigation(){

    if(!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex();


    const count =
        pageFlip.getPageCount();


    /*
       FRONT COVER
    */

    if(current === 0){

        pageInfo.textContent =
            "Cover";

    }


    /*
       BACK COVER
    */

    else if(
        current >= count - 1
    ){

        pageInfo.textContent =
            "Back cover";

    }


    /*
       INTERIOR
    */

    else{

        /*
           Landscape mode normally shows two pages.

           Page index 1 corresponds to PDF page 2.
        */

        const leftPage =
            current + 1;

        const rightPage =
            Math.min(
                current + 2,
                totalPages
            );


        pageInfo.textContent =
            leftPage +
            "–" +
            rightPage +
            " / " +
            totalPages;

    }


    /*
       PREVIOUS

       Disabled only when genuinely on the front cover.

       Therefore the first interior spread CAN return
       to the cover.
    */

    const atFront =
        current === 0;


    previous.disabled =
        atFront;

    previousControl.disabled =
        atFront;


    previous.classList.toggle(
        "disabled",
        atFront
    );


    /*
       NEXT

       Disabled only when on the back cover.
    */

    const atBack =
        current >= count - 1;


    next.disabled =
        atBack;

    nextControl.disabled =
        atBack;


    next.classList.toggle(
        "disabled",
        atBack
    );


    /*
       Center spine is shown only for an open book.
    */

    const orientation =
        pageFlip.getOrientation();


    const openSpread =
        orientation === "landscape" &&
        current > 0 &&
        current < count - 1;


    spine.classList.toggle(
        "visible",
        openSpread
    );


    bookShadow.classList.toggle(
        "visible",
        current > 0 &&
        current < count - 1
    );

}


/* =========================================================
   NEXT PAGE
========================================================= */

function goNext(){

    if(!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex();


    const last =
        pageFlip.getPageCount() - 1;


    if(current >= last)
        return;


    /*
       PageFlip handles:

       COVER → INTERIOR
       INTERIOR → INTERIOR
       INTERIOR → BACK COVER

       including the proper hard-cover animation.
    */

    pageFlip.flipNext(
        "bottom"
    );

}


/* =========================================================
   PREVIOUS PAGE
========================================================= */

function goPrevious(){

    if(!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex();


    /*
       Already at front cover.
    */

    if(current <= 0)
        return;


    /*
       FIRST INTERIOR SPREAD → FRONT COVER

       This is handled by PageFlip itself because the
       cover is a real hard page in the same book.
    */

    pageFlip.flipPrev(
        "bottom"
    );

}


/* =========================================================
   NAVIGATION EVENTS
========================================================= */

previous.onclick =
    goPrevious;

previousControl.onclick =
    goPrevious;

next.onclick =
    goNext;

nextControl.onclick =
    goNext;


/* =========================================================
   ZOOM
========================================================= */

function applyZoom(){

    bookArea.style.transform =
        "scale(" +
        zoom +
        ")";


    zoomReset.textContent =
        Math.round(
            zoom * 100
        ) +
        "%";

}


zoomIn.onclick =
    function(){

        zoom =
            Math.min(
                1.5,
                zoom + .1
            );

        applyZoom();

    };


zoomOut.onclick =
    function(){

        zoom =
            Math.max(
                .8,
                zoom - .1
            );

        applyZoom();

    };


zoomReset.onclick =
    function(){

        zoom =
            1;

        applyZoom();

    };


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreen.onclick =
    async function(){

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }else{

                await document
                    .exitFullscreen();

            }

        }catch(error){

            console.log(
                "Fullscreen error:",
                error
            );

        }

    };


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "ArrowRight"
        ){

            event.preventDefault();

            goNext();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            event.preventDefault();

            goPrevious();

        }


        if(
            event.key ===
            "PageDown"
        ){

            event.preventDefault();

            goNext();

        }


        if(
            event.key ===
            "PageUp"
        ){

            event.preventDefault();

            goPrevious();

        }


        if(event.key === "+"){

            zoomIn.click();

        }


        if(event.key === "-"){

            zoomOut.click();

        }


        if(event.key === "0"){

            zoomReset.click();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        if(!pageFlip)
            return;


        calculateBookSize();


        try{

            pageFlip.update();

        }catch(error){

            console.log(
                "PageFlip resize:",
                error
            );

        }


        updateNavigation();

    }
);


/* =========================================================
   LOAD VIEWER
========================================================= */

async function startViewer(){

    try{

        setLoading(
            "Loading annual report…"
        );


        /*
           Load the ONE fixed PDF.

           There is no upload button.
           There is no file selector.
        */

        const response =
            await fetch(
                PDF_FILE,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "PDF could not be loaded. HTTP " +
                response.status
            );

        }


        const buffer =
            await response.arrayBuffer();


        setLoading(
            "Reading annual report…"
        );


        pdf =
            await pdfjsLib
                .getDocument({
                    data:buffer
                })
                .promise;


        totalPages =
            pdf.numPages;


        if(totalPages < 2){

            throw new Error(
                "The PDF needs at least two pages."
            );

        }


        /*
           Get exact PDF page dimensions.
        */

        const firstPage =
            await pdf.getPage(1);


        const baseViewport =
            firstPage.getViewport({
                scale:1
            });


        pageWidth =
            baseViewport.width;

        pageHeight =
            baseViewport.height;


        calculateBookSize();


        /*
           Render every page.

           This includes the real front cover and
           the real back cover.
        */

        for(
            let pageNumber = 1;
            pageNumber <= totalPages;
            pageNumber++
        ){

            setLoading(
                "Preparing page " +
                pageNumber +
                " of " +
                totalPages +
                "…"
            );


            const imageURL =
                await renderPDFPage(
                    pageNumber,
                    1.35
                );


            createPage(
                imageURL,
                pageNumber
            );

        }


        /*
           Verify PageFlip.
        */

        if(
            !window.St ||
            !window.St.PageFlip
        ){

            throw new Error(
                "PageFlip library failed to load."
            );

        }


        setLoading(
            "Preparing book…"
        );


        /*
           =================================================
           THE IMPORTANT PART
           =================================================

           The front cover is NOT a separate element.

           The back cover is NOT a separate element.

           Both are genuine pages inside PageFlip.

           showCover:true makes first and last pages
           hard covers and displays them singly.

           The cover animation is therefore generated by
           the same PageFlip engine as the interior pages.
        */

        pageFlip =
            new St.PageFlip(
                flipbook,
                {

                    /*
                       Exact original PDF aspect ratio.
                    */

                    width:
                        pageWidth,

                    height:
                        pageHeight,


                    /*
                       FIXED is intentional.

                       This avoids the distortion caused by
                       stretching the parent during the
                       cover-to-spread transition.
                    */

                    size:
                        "fixed",


                    /*
                       Desktop book is two pages wide.
                    */

                    usePortrait:
                        false,


                    /*
                       REAL MAGAZINE COVERS
                    */

                    showCover:
                        true,


                    /*
                       Realistic turning shadow.
                    */

                    drawShadow:
                        true,

                    maxShadowOpacity:
                        .42,


                    /*
                       Smooth but not excessively slow.
                    */

                    flippingTime:
                        780,


                    /*
                       Start exactly on cover.
                    */

                    startPage:
                        0,

                    startZIndex:
                        0,


                    /*
                       Do not automatically change the
                       actual PDF page proportions.
                    */

                    autoSize:
                        false,


                    /*
                       Mouse/touch interaction.
                    */

                    useMouseEvents:
                        true,

                    mobileScrollSupport:
                        true,

                    swipeDistance:
                        30,


                    /*
                       Corner interaction.
                    */

                    showPageCorners:
                        true,

                    disableFlipByClick:
                        false,

                    clickEventForward:
                        true

                }
            );


        /*
           LOAD THE COMPLETE BOOK.

           Page 1:
              FRONT COVER — HARD

           Pages 2...N-1:
              INTERIOR — SOFT

           Page N:
              BACK COVER — HARD
        */

        pageFlip.loadFromHTML(
            flipbook.querySelectorAll(
                ".page"
            )
        );


        /*
           Page turned.
        */

        pageFlip.on(
            "flip",
            function(){

                updateNavigation();

            }
        );


        /*
           Portrait/landscape changed.
        */

        pageFlip.on(
            "changeOrientation",
            function(){

                updateNavigation();

            }
        );


        /*
           State changes.

           During animation, remove our static spine shadow
           so PageFlip's own moving shadow remains clean.
        */

        pageFlip.on(
            "changeState",
            function(event){

                if(
                    event.data ===
                    "flipping"
                ){

                    spine.style.opacity =
                        "0";

                    bookShadow.style.opacity =
                        "0";

                }


                if(
                    event.data ===
                    "read"
                ){

                    updateNavigation();

                }

            }
        );


        /*
           Wait one frame before revealing the book.

           This is important because the initial cover
           must be rendered in its final centered position,
           not after the browser has already displayed it.
        */

        requestAnimationFrame(
            function(){

                flipbook.classList.add(
                    "ready"
                );


                requestAnimationFrame(
                    function(){

                        flipbook.classList.add(
                            "visible"
                        );


                        updateNavigation();

                    }
                );

            }
        );


        /*
           Hide loading screen.
        */

        setTimeout(
            function(){

                loading.style.opacity =
                    "0";


                setTimeout(
                    function(){

                        loading.style.display =
                            "none";

                    },
                    350
                );

            },
            300
        );

    }
    catch(error){

        console.error(
            error
        );


        showError(
            error &&
            error.message
                ? error.message
                : "Unable to open the annual report."
        );

    }

}


/* =========================================================
   START
========================================================= */

startViewer();

</script>

</body>
</html>
