<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akhand Jyoti — Annual Report 2025–26</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>

/* =========================================================
   BASIC RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            ellipse at center,
            #424242 0%,
            #303030 35%,
            #1d1d1d 68%,
            #111111 100%
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;
}


/* =========================================================
   MAIN READER
========================================================= */

#reader{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
}


/*
   This is the actual book area.

   The book is always centered.
*/

#bookStage{
    position:relative;

    width:min(92vw,1280px);
    height:min(84vh,900px);

    display:flex;
    align-items:center;
    justify-content:center;

    transform-origin:center center;

    transition:
        transform .2s ease;
}


/* =========================================================
   FLIPBOOK CONTAINER
========================================================= */

#flipbook{
    position:relative;

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    visibility:hidden;
    opacity:0;

    transition:
        opacity .25s ease;
}

#flipbook.ready{
    visibility:visible;
}

#flipbook.visible{
    opacity:1;
}


/* =========================================================
   PDF PAGES
========================================================= */

.page{
    background:#fff;

    overflow:hidden;

    /*
       Important:
       first and last pages become hard covers.
    */

    box-shadow:
        0 2px 8px rgba(0,0,0,.16);
}

.page img{
    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#fff;

    user-select:none;
    -webkit-user-drag:none;
}


/* =========================================================
   CENTER SPINE SHADOW
========================================================= */

/*
   This gives the open magazine a subtle permanent
   binding shadow in the center.
*/

#spineShadow{
    position:absolute;

    z-index:100;

    left:50%;
    top:0;

    width:34px;
    height:100%;

    transform:translateX(-50%);

    pointer-events:none;

    opacity:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,.025) 15%,
            rgba(0,0,0,.10) 32%,
            rgba(0,0,0,.20) 46%,
            rgba(0,0,0,.25) 50%,
            rgba(0,0,0,.20) 54%,
            rgba(0,0,0,.10) 68%,
            rgba(0,0,0,.025) 85%,
            rgba(0,0,0,0) 100%
        );

    transition:
        opacity .25s ease;
}

#spineShadow.visible{
    opacity:1;
}


/*
   Very thin actual crease.
*/

#spineShadow::after{
    content:"";

    position:absolute;

    left:50%;
    top:0;

    width:1px;
    height:100%;

    transform:translateX(-50%);

    background:
        rgba(0,0,0,.16);
}


/* =========================================================
   TOP TITLE
========================================================= */

#title{
    position:fixed;

    z-index:500;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    color:rgba(255,255,255,.72);

    font-size:13px;
    font-weight:600;

    letter-spacing:.1px;

    white-space:nowrap;

    pointer-events:none;
}


/* =========================================================
   LARGE PREVIOUS / NEXT BUTTONS
========================================================= */

.navButton{
    position:fixed;

    z-index:900;

    top:50%;

    width:64px;
    height:116px;

    transform:translateY(-50%);

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(255,255,255,.13);

    border-radius:14px;

    background:
        rgba(20,20,20,.82);

    color:#fff;

    box-shadow:
        0 8px 25px rgba(0,0,0,.42);

    backdrop-filter:blur(8px);

    cursor:pointer;

    transition:
        background .18s ease,
        opacity .18s ease,
        transform .18s ease;
}

.navButton:hover{
    background:
        rgba(52,52,52,.94);
}

.navButton:active{
    transform:
        translateY(-50%)
        scale(.94);
}

.navButton span{
    font-size:60px;
    font-weight:200;
    line-height:1;

    margin-top:-5px;
}

#previousButton{
    left:15px;
}

#nextButton{
    right:15px;
}

.navButton.disabled{
    opacity:.20;
    pointer-events:none;
}


/* =========================================================
   BOTTOM CONTROL BAR
========================================================= */

#controls{
    position:fixed;

    z-index:1000;

    left:50%;
    bottom:13px;

    transform:translateX(-50%);

    display:flex;
    align-items:center;

    gap:6px;

    padding:7px 9px;

    border-radius:11px;

    background:
        rgba(25,25,25,.92);

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 9px 28px rgba(0,0,0,.42);

    backdrop-filter:blur(12px);
}

.control{
    width:38px;
    height:34px;

    padding:0;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius:7px;

    background:#303030;

    color:#fff;

    cursor:pointer;

    font-size:17px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.control:hover{
    background:#414141;
}

.control:disabled{
    opacity:.35;
    cursor:not-allowed;
}

#pageInfo{
    min-width:105px;

    text-align:center;

    color:#ddd;

    font-size:12px;

    font-variant-numeric:
        tabular-nums;
}

#zoomReset{
    width:48px;

    font-size:11px;
}


/* =========================================================
   HINT
========================================================= */

#hint{
    position:fixed;

    right:15px;
    bottom:20px;

    z-index:500;

    color:
        rgba(255,255,255,.34);

    font-size:11px;

    pointer-events:none;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

#loading{
    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#151515;

    transition:
        opacity .35s ease;
}

.loader{
    text-align:center;

    color:#ddd;

    font-size:13px;
}

.spinner{
    width:34px;
    height:34px;

    margin:0 auto 14px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.17);

    border-top-color:#fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

#error{
    position:fixed;

    inset:0;

    z-index:3000;

    display:none;

    align-items:center;
    justify-content:center;

    background:#151515;

    color:#ccc;

    text-align:center;

    padding:30px;
}

#error h2{
    color:#fff;

    margin-bottom:10px;
}

#error p{
    max-width:600px;

    line-height:1.6;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    #bookStage{
        width:94vw;
        height:78vh;
    }

    .navButton{
        width:48px;
        height:88px;
    }

    .navButton span{
        font-size:44px;
    }

    #previousButton{
        left:4px;
    }

    #nextButton{
        right:4px;
    }

    #hint{
        display:none;
    }

}


/* =========================================================
   VERY SMALL SCREENS
========================================================= */

@media(max-width:520px){

    #title{
        font-size:11px;
        max-width:90vw;

        overflow:hidden;
        text-overflow:ellipsis;
    }

    #controls{
        bottom:6px;
    }

    .control{
        width:34px;
        height:32px;
    }

    #pageInfo{
        min-width:72px;
        font-size:11px;
    }

    #zoomReset{
        width:44px;
    }

}

</style>
</head>


<body>


<!-- ======================================================
     READER
======================================================= -->

<div id="reader">

    <div id="bookStage">

        <!--
             ALL PDF PAGES ARE INSIDE THIS.

             PageFlip itself handles:
             - front cover
             - inside pages
             - back cover
             - page turning
             - shadows
             - spine
        -->

        <div id="flipbook"></div>

        <!-- Permanent center binding shadow -->
        <div id="spineShadow"></div>

    </div>

</div>


<!-- ======================================================
     TITLE
======================================================= -->

<div id="title">
    Akhand Jyoti — Annual Report 2025–26
</div>


<!-- ======================================================
     LARGE NAVIGATION
======================================================= -->

<button
    id="previousButton"
    class="navButton disabled"
    aria-label="Previous page"
    title="Previous page"
>
    <span>‹</span>
</button>


<button
    id="nextButton"
    class="navButton"
    aria-label="Next page"
    title="Next page"
>
    <span>›</span>
</button>


<!-- ======================================================
     BOTTOM CONTROLS
======================================================= -->

<div id="controls">

    <button
        id="previousControl"
        class="control"
        title="Previous page"
        aria-label="Previous page"
    >
        ‹
    </button>


    <div id="pageInfo">
        Cover
    </div>


    <button
        id="nextControl"
        class="control"
        title="Next page"
        aria-label="Next page"
    >
        ›
    </button>


    <button
        id="zoomOut"
        class="control"
        title="Zoom out"
        aria-label="Zoom out"
    >
        −
    </button>


    <button
        id="zoomReset"
        class="control"
        title="Reset zoom"
        aria-label="Reset zoom"
    >
        100%
    </button>


    <button
        id="zoomIn"
        class="control"
        title="Zoom in"
        aria-label="Zoom in"
    >
        +
    </button>


    <button
        id="fullscreen"
        class="control"
        title="Fullscreen"
        aria-label="Fullscreen"
    >
        ⛶
    </button>

</div>


<div id="hint">
    Drag a page corner or use the arrows
</div>


<!-- ======================================================
     LOADING
======================================================= -->

<div id="loading">

    <div class="loader">

        <div class="spinner"></div>

        <div id="loadingText">
            Opening annual report…
        </div>

    </div>

</div>


<!-- ======================================================
     ERROR
======================================================= -->

<div id="error">

    <div>

        <h2>
            Unable to open the annual report
        </h2>

        <p id="errorText"></p>

    </div>

</div>



<script>

/* =========================================================
   PDF.JS WORKER
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   IMPORTANT
   Keep the PDF in the SAME GitHub repository folder
   as this index.html.
========================================================= */

const PDF_FILE =
    "Annual report 25-26_V2.pdf";


/* =========================================================
   DOM
========================================================= */

const bookStage =
    document.getElementById("bookStage");

const flipbook =
    document.getElementById("flipbook");

const spineShadow =
    document.getElementById("spineShadow");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");

const pageInfo =
    document.getElementById("pageInfo");

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const previousControl =
    document.getElementById("previousControl");

const nextControl =
    document.getElementById("nextControl");

const zoomIn =
    document.getElementById("zoomIn");

const zoomOut =
    document.getElementById("zoomOut");

const zoomReset =
    document.getElementById("zoomReset");

const fullscreen =
    document.getElementById("fullscreen");


/* =========================================================
   VARIABLES
========================================================= */

let pdf = null;

let pageFlip = null;

let totalPages = 0;

let zoom =
    1;


/* =========================================================
   LOADING
========================================================= */

function setLoading(message){

    loadingText.textContent =
        message;

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    loading.style.display =
        "none";

    errorText.textContent =
        message;

    errorBox.style.display =
        "flex";

}


/* =========================================================
   RENDER ONE PDF PAGE
========================================================= */

async function renderPDFPage(
    pageNumber,
    scale
){

    const page =
        await pdf.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({
            scale:scale
        });


    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    canvas.width =
        Math.ceil(
            viewport.width
        );


    canvas.height =
        Math.ceil(
            viewport.height
        );


    await page.render({

        canvasContext:
            context,

        viewport:
            viewport

    }).promise;


    return canvas.toDataURL(
        "image/jpeg",
        .92
    );

}


/* =========================================================
   CREATE PAGE
========================================================= */

function createPage(
    imageURL,
    pageNumber
){

    const page =
        document.createElement(
            "div"
        );


    page.className =
        "page";


    /*
       HARD pages are used for:
       - first page = front cover
       - last page = back cover

       Soft pages are used for all interior pages.
    */

    if(
        pageNumber === 1 ||
        pageNumber === totalPages
    ){

        page.dataset.density =
            "hard";

    }else{

        page.dataset.density =
            "soft";

    }


    const image =
        document.createElement(
            "img"
        );


    image.src =
        imageURL;


    image.alt =
        "Annual Report page " +
        pageNumber;


    image.draggable =
        false;


    page.appendChild(
        image
    );


    flipbook.appendChild(
        page
    );

}


/* =========================================================
   BOOK SIZE
========================================================= */

function calculateBookSize(
    pageWidth,
    pageHeight
){

    const pageRatio =
        pageWidth /
        pageHeight;


    /*
       Desktop book:

       two portrait pages side-by-side.

       Maximum width:
       92vw

       Maximum height:
       84vh
    */

    const maxWidth =
        Math.min(
            window.innerWidth * .92,
            1280
        );


    const maxHeight =
        Math.min(
            window.innerHeight * .84,
            900
        );


    let height =
        maxHeight;


    let width =
        height *
        pageRatio *
        2;


    if(width > maxWidth){

        width =
            maxWidth;

        height =
            width /
            (pageRatio * 2);

    }


    bookStage.style.width =
        Math.round(width) +
        "px";


    bookStage.style.height =
        Math.round(height) +
        "px";

}


/* =========================================================
   UPDATE NAVIGATION
========================================================= */

function updateNavigation(){

    if(!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex();


    const count =
        pageFlip.getPageCount();


    const orientation =
        pageFlip.getOrientation();


    /*
       FRONT COVER
    */

    if(current === 0){

        pageInfo.textContent =
            "Cover";

    }


    /*
       BACK COVER
    */

    else if(current >= count - 1){

        pageInfo.textContent =
            "Back cover";

    }


    /*
       INTERIOR
    */

    else{

        if(
            orientation ===
            "landscape"
        ){

            /*
               In landscape mode the current page index
               represents the left page of the spread.
            */

            const leftPage =
                current + 1;


            const rightPage =
                Math.min(
                    current + 2,
                    totalPages
                );


            pageInfo.textContent =
                leftPage +
                "–" +
                rightPage +
                " / " +
                totalPages;

        }else{

            pageInfo.textContent =
                (current + 1) +
                " / " +
                totalPages;

        }

    }


    /*
       PREVIOUS

       The previous button is enabled on the first
       interior spread so that it can return to the cover.
    */

    const atBeginning =
        current === 0;


    previousButton.classList.toggle(
        "disabled",
        atBeginning
    );


    previousControl.disabled =
        atBeginning;


    /*
       NEXT
    */

    const atEnd =
        current >= count - 1;


    nextButton.classList.toggle(
        "disabled",
        atEnd
    );


    nextControl.disabled =
        atEnd;


    /*
       Spine is visible only when an actual open spread
       is being displayed.
    */

    const showSpine =
        orientation === "landscape" &&
        current > 0 &&
        current < count - 1;


    spineShadow.classList.toggle(
        "visible",
        showSpine
    );

}


/* =========================================================
   NEXT
========================================================= */

function goNext(){

    if(!pageFlip)
        return;


    if(
        pageFlip.getCurrentPageIndex() >=
        pageFlip.getPageCount() - 1
    ){

        return;
    }


    pageFlip.flipNext(
        "bottom"
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function goPrevious(){

    if(!pageFlip)
        return;


    if(
        pageFlip.getCurrentPageIndex() <=
        0
    ){

        return;
    }


    /*
       This is important.

       PageFlip itself contains the front cover.
       Therefore when the reader is on the FIRST
       interior spread, flipPrev() naturally returns
       to the actual front cover.

       There is no separate cover animation and
       no custom cover-position calculation.
    */

    pageFlip.flipPrev(
        "bottom"
    );

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

previousButton.onclick =
    goPrevious;

previousControl.onclick =
    goPrevious;

nextButton.onclick =
    goNext;

nextControl.onclick =
    goNext;


/* =========================================================
   ZOOM
========================================================= */

function applyZoom(){

    bookStage.style.transform =
        "scale(" +
        zoom +
        ")";


    zoomReset.textContent =
        Math.round(
            zoom * 100
        ) +
        "%";

}


/* ZOOM IN */

zoomIn.onclick =
    function(){

        zoom =
            Math.min(
                1.50,
                zoom + .10
            );


        applyZoom();

    };


/* ZOOM OUT */

zoomOut.onclick =
    function(){

        zoom =
            Math.max(
                .80,
                zoom - .10
            );


        applyZoom();

    };


/* RESET */

zoomReset.onclick =
    function(){

        zoom =
            1;


        applyZoom();

    };


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreen.onclick =
    async function(){

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }else{

                await document
                    .exitFullscreen();

            }

        }catch(error){

            console.log(
                "Fullscreen unavailable",
                error
            );

        }

    };


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "ArrowRight"
        ){

            event.preventDefault();

            goNext();

        }


        if(
            event.key ===
            "ArrowLeft"
        ){

            event.preventDefault();

            goPrevious();

        }


        if(
            event.key ===
            "PageDown"
        ){

            event.preventDefault();

            goNext();

        }


        if(
            event.key ===
            "PageUp"
        ){

            event.preventDefault();

            goPrevious();

        }


        if(
            event.key ===
            "+"
        ){

            zoomIn.click();

        }


        if(
            event.key ===
            "-"
        ){

            zoomOut.click();

        }


        if(
            event.key ===
            "0"
        ){

            zoomReset.click();

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        if(!pageFlip)
            return;


        /*
           PageFlip's update method recalculates
           the book after the browser changes size.
        */

        try{

            pageFlip.update();

        }catch(error){

            console.log(
                "Resize update:",
                error
            );

        }


        updateNavigation();

    }
);


/* =========================================================
   LOAD THE PDF
========================================================= */

async function startViewer(){

    try{

        setLoading(
            "Loading annual report…"
        );


        /*
           Fetch the fixed PDF.

           There is NO upload button and NO file selector.
        */

        const response =
            await fetch(
                PDF_FILE,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "The PDF returned HTTP " +
                response.status
            );

        }


        const buffer =
            await response.arrayBuffer();


        setLoading(
            "Opening annual report…"
        );


        pdf =
            await pdfjsLib
                .getDocument({
                    data:buffer
                })
                .promise;


        totalPages =
            pdf.numPages;


        if(totalPages < 2){

            throw new Error(
                "The PDF must contain at least two pages."
            );

        }


        /*
           Get the real PDF page dimensions.

           This prevents the book from being incorrectly
           positioned when the cover is opened.
        */

        const firstPDFPage =
            await pdf.getPage(1);


        const viewport =
            firstPDFPage.getViewport({
                scale:1
            });


        calculateBookSize(
            viewport.width,
            viewport.height
        );


        /*
           Render EVERY page.

           Page 1 = front cover
           Page 2 onward = interior
           Last page = back cover
        */

        for(
            let pageNumber = 1;
            pageNumber <= totalPages;
            pageNumber++
        ){

            setLoading(
                "Preparing page " +
                pageNumber +
                " of " +
                totalPages +
                "…"
            );


            const imageURL =
                await renderPDFPage(
                    pageNumber,
                    1.45
                );


            createPage(
                imageURL,
                pageNumber
            );

        }


        /*
           Check that the PageFlip library loaded.
        */

        if(
            !window.St ||
            !window.St.PageFlip
        ){

            throw new Error(
                "The page-flip library could not be loaded."
            );

        }


        setLoading(
            "Preparing book…"
        );


        /*
           IMPORTANT SETTINGS

           showCover:true
             → first page is a real front cover
             → last page is a real back cover
             → covers are displayed as single pages

           usePortrait:false
             → desktop stays as a proper two-page spread

           drawShadow:true
             → realistic page shadows

           showPageCorners:true
             → subtle corner fold when pointer approaches
               the page corner

           disableFlipByClick:false
             → clicking/dragging pages works
        */

        pageFlip =
            new St.PageFlip(
                flipbook,
                {

                    width:
                        viewport.width,

                    height:
                        viewport.height,


                    size:
                        "stretch",


                    minWidth:
                        260,

                    maxWidth:
                        900,

                    minHeight:
                        360,

                    maxHeight:
                        1300,


                    /*
                       This is what makes the first and
                       last pages behave as magazine covers.
                    */

                    showCover:
                        true,


                    /*
                       Desktop should remain a landscape
                       two-page spread.
                    */

                    usePortrait:
                        false,


                    /*
                       Realistic page shadows.
                    */

                    drawShadow:
                        true,

                    maxShadowOpacity:
                        .38,


                    /*
                       Softer and slightly faster than the
                       default 1000ms animation.
                    */

                    flippingTime:
                        760,


                    startPage:
                        0,


                    startZIndex:
                        0,


                    autoSize:
                        true,


                    mobileScrollSupport:
                        true,


                    swipeDistance:
                        30,


                    clickEventForward:
                        true,


                    useMouseEvents:
                        true,


                    showPageCorners:
                        true,


                    disableFlipByClick:
                        false

                }
            );


        /*
           Load the COMPLETE PDF into PageFlip.

           This is the key difference from the previous
           versions: the front cover is NOT separated from
           the book.
        */

        pageFlip.loadFromHTML(
            flipbook.querySelectorAll(
                ".page"
            )
        );


        /*
           Listen for every page turn.
        */

        pageFlip.on(
            "flip",
            function(){

                updateNavigation();

            }
        );


        /*
           Listen when the orientation changes.
        */

        pageFlip.on(
            "changeOrientation",
            function(){

                updateNavigation();

            }
        );


        /*
           While the page is turning, temporarily soften
           the permanent spine shadow so it doesn't fight
           with PageFlip's own dynamic shadow.
        */

        pageFlip.on(
            "changeState",
            function(event){

                if(
                    event.data ===
                    "flipping"
                ){

                    spineShadow.style.opacity =
                        "0";

                }


                if(
                    event.data ===
                    "read"
                ){

                    updateNavigation();

                }

            }
        );


        /*
           Make the book visible only after ALL pages and
           the PageFlip engine are ready.

           This prevents the initial cover from jumping
           from one position to another.
        */

        flipbook.classList.add(
            "ready"
        );


        requestAnimationFrame(
            function(){

                flipbook.classList.add(
                    "visible"
                );

            }
        );


        /*
           Initial navigation state.
        */

        setTimeout(
            function(){

                updateNavigation();

            },
            100
        );


        /*
           Hide loading screen.
        */

        setTimeout(
            function(){

                loading.style.opacity =
                    "0";


                setTimeout(
                    function(){

                        loading.style.display =
                            "none";

                    },
                    350
                );

            },
            250
        );

    }
    catch(error){

        console.error(
            "Viewer error:",
            error
        );


        showError(
            error &&
            error.message
                ? error.message
                : "Unknown error while opening the PDF."
        );

    }

}


/* =========================================================
   START
========================================================= */

startViewer();

</script>

</body>
</html>
