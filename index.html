<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Akhand Jyoti Annual Report 2025–26</title>

<!-- PDF rendering engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* =========================================================
   VIEWER CSS
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            ellipse at center,
            #f8f8f8 0%,
            #eeeeee 55%,
            #dedede 100%
        );

    font-family: Arial, sans-serif;
}

/* BOOK AREA */

#reader {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* BOOK */

#book {
    position: relative;

    width: min(88vw, 1250px);
    height: min(86vh, 860px);

    perspective: 2400px;

    transform-style: preserve-3d;

    transition: transform .25s ease;
}

/* NORMAL PAGES */

.page {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    background: white;

    overflow: hidden;

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);
}

.page img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    user-select: none;
    -webkit-user-drag: none;
}

/* LEFT */

#leftPage {
    left: 0;
}

/* RIGHT */

#rightPage {
    right: 0;
}

/* =========================================================
   FIRST / LAST SINGLE PAGE
========================================================= */

#singlePage {
    position: absolute;

    top: 0;
    left: 25%;

    width: 50%;
    height: 100%;

    background: white;

    overflow: hidden;

    transform-origin: left center;

    transform-style: preserve-3d;

    box-shadow:
        0 4px 18px rgba(0,0,0,.18);

    z-index: 100;
}

#singlePage img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}

/* =========================================================
   TURNING PAGE
========================================================= */

#turnPage {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    display: none;

    z-index: 500;

    transform-style: preserve-3d;

    backface-visibility: hidden;
}

.turnSide {
    position: absolute;

    inset: 0;

    background: white;

    overflow: hidden;

    backface-visibility: hidden;
}

.turnSide img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}

/* BACK SIDE */

.turnBack {
    transform: rotateY(180deg);
}

/* =========================================================
   CENTER BINDING SHADOW
========================================================= */

#binding {
    position: absolute;

    left: 50%;
    top: 0;

    width: 34px;
    height: 100%;

    transform: translateX(-50%);

    pointer-events: none;

    z-index: 800;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.05),
            rgba(0,0,0,.18),
            rgba(0,0,0,.22),
            rgba(0,0,0,.18),
            rgba(0,0,0,.05),
            transparent
        );

    opacity: 0;
}

#binding.visible {
    opacity: 1;
}

/* =========================================================
   NAVIGATION
========================================================= */

.nav {
    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    width: 66px;
    height: 116px;

    border: 0;
    border-radius: 12px;

    background: rgba(35,35,35,.85);

    color: white;

    font-size: 58px;
    font-weight: 200;

    cursor: pointer;

    z-index: 2000;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .2s,
        opacity .2s,
        transform .2s;
}

.nav:hover {
    background: rgba(15,15,15,.95);
}

.nav:active {
    transform:
        translateY(-50%)
        scale(.94);
}

#previous {
    left: 18px;
}

#next {
    right: 18px;
}

.nav.disabled {
    opacity: .18;
    pointer-events: none;
}

/* =========================================================
   BOTTOM BAR
========================================================= */

#controls {
    position: fixed;

    left: 50%;
    bottom: 16px;

    transform: translateX(-50%);

    z-index: 3000;

    display: flex;
    gap: 5px;

    padding: 7px;

    background: rgba(25,25,25,.92);

    border-radius: 9px;
}

.control {
    width: 38px;
    height: 34px;

    border: 0;
    border-radius: 6px;

    background: #333;

    color: white;

    cursor: pointer;
}

.control:hover {
    background: #4a4a4a;
}

#pageInfo {
    min-width: 100px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #ddd;

    font-size: 12px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px) {

    #book {
        width: 94vw;
        height: 78vh;
    }

    .nav {
        width: 48px;
        height: 82px;

        font-size: 42px;
    }

    #previous {
        left: 4px;
    }

    #next {
        right: 4px;
    }
}
</style>
</head>


<body>

<div id="reader">

    <div id="book">

        <!-- LEFT PAGE -->
        <div id="leftPage" class="page">
            <img>
        </div>

        <!-- RIGHT PAGE -->
        <div id="rightPage" class="page">
            <img>
        </div>

        <!-- SINGLE COVER -->
        <div id="singlePage">
            <img>
        </div>

        <!-- ACTUAL TURNING PAGE -->
        <div id="turnPage">

            <div class="turnSide turnFront">
                <img>
            </div>

            <div class="turnSide turnBack">
                <img>
            </div>

        </div>

        <!-- CENTER SHADOW -->
        <div id="binding"></div>

    </div>

</div>


<!-- LARGE NAVIGATION -->

<button
    id="previous"
    class="nav disabled"
>
    ‹
</button>

<button
    id="next"
    class="nav"
>
    ›
</button>


<!-- CONTROLS -->

<div id="controls">

    <button
        id="prevControl"
        class="control"
    >
        ‹
    </button>

    <div id="pageInfo">
        Cover
    </div>

    <button
        id="nextControl"
        class="control"
    >
        ›
    </button>

    <button
        id="zoomOut"
        class="control"
    >
        −
    </button>

    <button
        id="zoomReset"
        class="control"
    >
        100%
    </button>

    <button
        id="zoomIn"
        class="control"
    >
        +
    </button>

    <button
        id="fullscreen"
        class="control"
    >
        ⛶
    </button>

</div>


<script>

/* =========================================================
   JAVASCRIPT
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/*
   YOUR PDF

   It must be in the SAME GitHub folder
   as this index.html.
*/

const PDF_FILE =
    "./Annual%20report%2025-26_V2.pdf";


const book =
    document.getElementById("book");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const singlePage =
    document.getElementById("singlePage");

const turnPage =
    document.getElementById("turnPage");

const binding =
    document.getElementById("binding");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const prevControl =
    document.getElementById("prevControl");

const nextControl =
    document.getElementById("nextControl");

const pageInfo =
    document.getElementById("pageInfo");


let pdf;

let pages = [];

let totalPages = 0;


/*
   State:

   0  = cover

   1  = pages 2–3

   3  = pages 4–5

   5  = pages 6–7

   ...

   last = back cover
*/

let current = 0;

let animating = false;

let zoom = 1;


/* =========================================================
   RENDER PDF PAGE
========================================================= */

async function renderPDFPage(number) {

    const page =
        await pdf.getPage(number);

    const viewport =
        page.getViewport({
            scale: 1.6
        });

    const canvas =
        document.createElement("canvas");

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    const ctx =
        canvas.getContext("2d");

    await page.render({
        canvasContext: ctx,
        viewport: viewport
    }).promise;

    return canvas.toDataURL(
        "image/jpeg",
        .95
    );
}


/* =========================================================
   PUT PAGE IMAGE
========================================================= */

function setPage(element, index) {

    const image =
        element.querySelector("img");

    if (
        index >= 0 &&
        index < pages.length
    ) {

        image.src =
            pages[index];

    } else {

        image.removeAttribute("src");

    }
}


/* =========================================================
   DISPLAY CURRENT STATE
========================================================= */

function displayState() {

    leftPage.style.display =
        "none";

    rightPage.style.display =
        "none";

    singlePage.style.display =
        "none";


    /* COVER */

    if (current === 0) {

        setPage(
            singlePage,
            0
        );

        singlePage.style.display =
            "block";

        binding.classList.remove(
            "visible"
        );

        pageInfo.textContent =
            "Cover";

    }


    /* BACK COVER */

    else if (
        current ===
        totalPages - 1
    ) {

        setPage(
            singlePage,
            totalPages - 1
        );

        singlePage.style.display =
            "block";

        binding.classList.remove(
            "visible"
        );

        pageInfo.textContent =
            "Back cover";

    }


    /* NORMAL SPREAD */

    else {

        setPage(
            leftPage,
            current
        );

        setPage(
            rightPage,
            current + 1
        );

        leftPage.style.display =
            "block";

        rightPage.style.display =
            "block";

        binding.classList.add(
            "visible"
        );

        pageInfo.textContent =
            `${current + 1} – ${current + 2} / ${totalPages}`;

    }


    updateButtons();
}


/* =========================================================
   BUTTON STATE
========================================================= */

function updateButtons() {

    const first =
        current === 0;

    const last =
        current ===
        totalPages - 1;


    previous.classList.toggle(
        "disabled",
        first
    );

    next.classList.toggle(
        "disabled",
        last
    );


    prevControl.disabled =
        first;

    nextControl.disabled =
        last;
}


/* =========================================================
   NEXT
========================================================= */

function goNext() {

    if (
        animating ||
        current >= totalPages - 1
    ) {
        return;
    }


    animating = true;


    /*
       COVER → FIRST SPREAD

       Page 1 is treated exactly like
       every other turning page.
    */

    if (current === 0) {

        setPage(
            leftPage,
            1
        );

        setPage(
            rightPage,
            2
        );


        leftPage.style.display =
            "block";

        rightPage.style.display =
            "block";


        setPage(
            turnPage,
            0
        );


        turnPage.style.display =
            "block";

        turnPage.style.left =
            "25%";

        turnPage.style.transformOrigin =
            "left center";

        turnPage.style.transform =
            "rotateY(0deg)";

        turnPage.style.transition =
            "none";


        singlePage.style.display =
            "none";


        void turnPage.offsetWidth;


        turnPage.style.transition =
            "transform .8s cubic-bezier(.22,.61,.36,1)";


        requestAnimationFrame(() => {

            turnPage.style.transform =
                "rotateY(-180deg)";

        });


        setTimeout(() => {

            turnPage.style.display =
                "none";

            current = 1;

            displayState();

            animating = false;

        }, 820);


        return;
    }


    /*
       NORMAL SPREAD
    */

    const turningPage =
        current + 1;

    const newLeft =
        current + 2;


    setPage(
        turnPage,
        turningPage
    );


    setPage(
        leftPage,
        newLeft
    );


    leftPage.style.display =
        "block";


    turnPage.style.display =
        "block";

    turnPage.style.left =
        "50%";

    turnPage.style.transformOrigin =
        "left center";

    turnPage.style.transform =
        "rotateY(0deg)";

    turnPage.style.transition =
        "none";


    void turnPage.offsetWidth;


    turnPage.style.transition =
        "transform .8s cubic-bezier(.22,.61,.36,1)";


    requestAnimationFrame(() => {

        turnPage.style.transform =
            "rotateY(-180deg)";

    });


    setTimeout(() => {

        turnPage.style.display =
            "none";

        current += 2;

        displayState();

        animating = false;

    }, 820);
}


/* =========================================================
   PREVIOUS
========================================================= */

function goPrevious() {

    if (
        animating ||
        current <= 0
    ) {
        return;
    }


    animating = true;


    /*
       FIRST SPREAD → COVER
    */

    if (current === 1) {

        setPage(
            turnPage,
            1
        );


        turnPage.style.display =
            "block";

        turnPage.style.left =
            "0";

        turnPage.style.transformOrigin =
            "right center";

        turnPage.style.transform =
            "rotateY(0deg)";

        turnPage.style.transition =
            "none";


        void turnPage.offsetWidth;


        turnPage.style.transition =
            "transform .8s cubic-bezier(.22,.61,.36,1)";


        requestAnimationFrame(() => {

            turnPage.style.transform =
                "rotateY(180deg)";

        });


        setTimeout(() => {

            turnPage.style.display =
                "none";

            current = 0;

            displayState();

            animating = false;

        }, 820);


        return;
    }


    /*
       NORMAL BACKWARD TURN
    */

    const turningPage =
        current;

    const previousLeft =
        current - 1;


    setPage(
        turnPage,
        turningPage
    );


    setPage(
        rightPage,
        previousLeft
    );


    rightPage.style.display =
        "block";


    turnPage.style.display =
        "block";

    turnPage.style.left =
        "0";

    turnPage.style.transformOrigin =
        "right center";

    turnPage.style.transform =
        "rotateY(0deg)";

    turnPage.style.transition =
        "none";


    void turnPage.offsetWidth;


    turnPage.style.transition =
        "transform .8s cubic-bezier(.22,.61,.36,1)";


    requestAnimationFrame(() => {

        turnPage.style.transform =
            "rotateY(180deg)";

    });


    setTimeout(() => {

        turnPage.style.display =
            "none";

        current -= 2;

        displayState();

        animating = false;

    }, 820);
}


/* =========================================================
   BUTTONS
========================================================= */

next.onclick =
    goNext;

nextControl.onclick =
    goNext;

previous.onclick =
    goPrevious;

prevControl.onclick =
    goPrevious;


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowRight"
        ) {
            goNext();
        }

        if (
            event.key === "ArrowLeft"
        ) {
            goPrevious();
        }

    }
);


/* =========================================================
   ZOOM
========================================================= */

function applyZoom() {

    book.style.transform =
        `scale(${zoom})`;

    document.getElementById(
        "zoomReset"
    ).textContent =
        `${Math.round(zoom * 100)}%`;
}


document.getElementById(
    "zoomIn"
).onclick = () => {

    zoom =
        Math.min(
            1.5,
            zoom + .1
        );

    applyZoom();
};


document.getElementById(
    "zoomOut"
).onclick = () => {

    zoom =
        Math.max(
            .7,
            zoom - .1
        );

    applyZoom();
};


document.getElementById(
    "zoomReset"
).onclick = () => {

    zoom = 1;

    applyZoom();
};


/* =========================================================
   FULLSCREEN
========================================================= */

document.getElementById(
    "fullscreen"
).onclick = async () => {

    if (!document.fullscreenElement) {

        await document.documentElement
            .requestFullscreen();

    } else {

        await document.exitFullscreen();

    }
};


/* =========================================================
   LOAD PDF
========================================================= */

async function loadBook() {

    try {

        const response =
            await fetch(PDF_FILE);

        if (!response.ok) {

            throw new Error(
                "PDF could not be loaded."
            );

        }

        const buffer =
            await response.arrayBuffer();


        pdf =
            await pdfjsLib
                .getDocument({
                    data: buffer
                })
                .promise;


        totalPages =
            pdf.numPages;


        /*
           Render all pages once.
        */

        for (
            let i = 1;
            i <= totalPages;
            i++
        ) {

            pages.push(
                await renderPDFPage(i)
            );

        }


        displayState();

    }

    catch (error) {

        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#151515;
                color:white;
                font-family:Arial;
                text-align:center;
            ">
                <div>
                    <h2>Unable to open the annual report</h2>
                    <p>${error.message}</p>
                </div>
            </div>
        `;

        console.error(error);
    }
}


loadBook();

</script>

</body>
</html>
