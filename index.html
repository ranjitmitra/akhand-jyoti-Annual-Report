<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akhand Jyoti — Annual Report 2025–26</title>

<style>
:root{
  --bg1:#3a3a3a;
  --bg2:#181818;
  --ui:rgba(22,22,22,.88);
  --white:#fff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(
      ellipse at center 42%,
      #454545 0%,
      #2a2a2a 34%,
      #151515 76%,
      #0d0d0d 100%
    );
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}

#reader{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#bookWrap{
  position:relative;
  width:min(94vw,1240px);
  height:min(86vh,900px);
  display:flex;
  align-items:center;
  justify-content:center;
}

#book{
  position:relative;
  margin:auto;
  box-shadow:0 24px 55px rgba(0,0,0,.5);
}

/* Middle gutter shadow */
#book.spread::after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:34px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:50;
  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(0,0,0,.035) 18%,
      rgba(0,0,0,.12) 50%,
      rgba(0,0,0,.035) 82%,
      transparent 100%
    );
  opacity:0;
  transition:opacity .2s ease;
}

#book.spread::after{
  opacity:1;
}

.page{
  background:#fff;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}

.page img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#fff;
  user-select:none;
  -webkit-user-drag:none;
}

.page-cover{
  box-shadow:0 10px 30px rgba(0,0,0,.22);
}

/* Loading */
#loader{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171717;
  transition:opacity .3s;
}

.loader-inner{
  text-align:center;
  color:#ddd;
  font-size:13px;
}

.spinner{
  width:34px;
  height:34px;
  margin:0 auto 13px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.18);
  border-top-color:#fff;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#title{
  position:fixed;
  z-index:500;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  font-weight:600;
  color:rgba(255,255,255,.78);
  pointer-events:none;
  white-space:nowrap;
}

/* Prominent navigation */
.edgeNav{
  position:fixed;
  z-index:700;
  top:50%;
  transform:translateY(-50%);
  width:58px;
  height:116px;
  border:0;
  border-radius:14px;
  background:rgba(18,18,18,.72);
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  backdrop-filter:blur(8px);
  transition:
    background .2s,
    opacity .2s,
    transform .2s;
}

.edgeNav:hover{
  background:rgba(40,40,40,.94);
}

.edgeNav:active{
  transform:translateY(-50%) scale(.96);
}

.edgeNav span{
  font-size:54px;
  font-weight:200;
  line-height:1;
  margin-top:-4px;
}

#prevEdge{
  left:18px;
}

#nextEdge{
  right:18px;
}

.edgeNav.disabled{
  opacity:.18;
  pointer-events:none;
}

/* Bottom controls */
#controls{
  position:fixed;
  z-index:800;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 9px;
  border-radius:12px;
  background:var(--ui);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 9px 28px rgba(0,0,0,.42);
  backdrop-filter:blur(12px);
}

.control{
  width:38px;
  height:35px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:7px;
  background:#303030;
  color:#fff;
  cursor:pointer;
  font-size:16px;
}

.control:hover{
  background:#414141;
}

#pageInfo{
  min-width:95px;
  text-align:center;
  font-size:12px;
  color:#ddd;
  font-variant-numeric:tabular-nums;
}

#zoomLabel{
  width:48px;
  font-size:11px;
}

#hint{
  position:fixed;
  z-index:500;
  right:16px;
  bottom:20px;
  font-size:11px;
  color:rgba(255,255,255,.38);
}

@media(max-width:850px){

  #bookWrap{
    width:100vw;
    height:82vh;
  }

  .edgeNav{
    width:46px;
    height:92px;
    border-radius:10px;
  }

  .edgeNav span{
    font-size:42px;
  }

  #prevEdge{
    left:6px;
  }

  #nextEdge{
    right:6px;
  }

  #title{
    font-size:11px;
    max-width:88%;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #hint{
    display:none;
  }
}

@media(max-width:520px){

  #controls{
    bottom:7px;
  }

  .control{
    width:34px;
    height:33px;
  }

  #pageInfo{
    min-width:74px;
  }
}
</style>
</head>

<body>

<div id="reader">

  <div id="bookWrap">

    <div id="book"></div>

  </div>

</div>

<div id="title">
  Akhand Jyoti — Annual Report 2025–26
</div>


<!-- Previous -->

<button
  id="prevEdge"
  class="edgeNav disabled"
  aria-label="Previous page"
  title="Previous page"
>
  <span>‹</span>
</button>


<!-- Next -->

<button
  id="nextEdge"
  class="edgeNav"
  aria-label="Next page"
  title="Next page"
>
  <span>›</span>
</button>


<!-- Controls -->

<div id="controls">

  <button
    class="control"
    id="prev"
    title="Previous page"
  >
    ‹
  </button>

  <div id="pageInfo">
    Cover
  </div>

  <button
    class="control"
    id="next"
    title="Next page"
  >
    ›
  </button>

  <button
    class="control"
    id="zoomOut"
    title="Zoom out"
  >
    −
  </button>

  <button
    class="control"
    id="zoomLabel"
    title="Reset zoom"
  >
    100%
  </button>

  <button
    class="control"
    id="zoomIn"
    title="Zoom in"
  >
    +
  </button>

  <button
    class="control"
    id="full"
    title="Fullscreen"
  >
    ⛶
  </button>

</div>


<div id="hint">
  Drag a page corner or use the arrows
</div>


<!-- Loading -->

<div id="loader">

  <div class="loader-inner">

    <div class="spinner"></div>

    <div id="loadText">
      Preparing your annual report…
    </div>

  </div>

</div>


<!-- Page Flip library -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>


<script type="module">

/* =========================================================
   PDF.JS
========================================================= */

const pdfjsLib =
  await import(
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
  );

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   YOUR PDF
========================================================= */

const PDF_FILE =
  "Annual report 25-26_V2.pdf";


/* =========================================================
   ELEMENTS
========================================================= */

const book =
  document.getElementById("book");

const wrap =
  document.getElementById("bookWrap");

const loader =
  document.getElementById("loader");

const loadText =
  document.getElementById("loadText");

const info =
  document.getElementById("pageInfo");

const prev =
  document.getElementById("prev");

const next =
  document.getElementById("next");

const prevEdge =
  document.getElementById("prevEdge");

const nextEdge =
  document.getElementById("nextEdge");

const zoomIn =
  document.getElementById("zoomIn");

const zoomOut =
  document.getElementById("zoomOut");

const zoomLabel =
  document.getElementById("zoomLabel");

const full =
  document.getElementById("full");


/* =========================================================
   VARIABLES
========================================================= */

let pdf = null;

let pageFlip = null;

let images = [];

let zoom = 1;

let total = 82;


/* =========================================================
   LOADING TEXT
========================================================= */

function setLoad(text){

  loadText.textContent =
    text;

}


/* =========================================================
   RENDER PDF PAGE
========================================================= */

function render(n){

  return pdf
    .getPage(n)
    .then(page => {

      const scale = 1.25;

      const viewport =
        page.getViewport({
          scale
        });

      const canvas =
        document.createElement(
          "canvas"
        );

      const ctx =
        canvas.getContext(
          "2d",
          {
            alpha:false
          }
        );

      canvas.width =
        Math.ceil(
          viewport.width
        );

      canvas.height =
        Math.ceil(
          viewport.height
        );

      return page
        .render({
          canvasContext:ctx,
          viewport
        })
        .promise
        .then(() => {

          return canvas.toDataURL(
            "image/jpeg",
            .9
          );

        });

    });

}


/* =========================================================
   CREATE PAGE
========================================================= */

function createPage(src,index){

  const page =
    document.createElement(
      "div"
    );

  page.className =
    "page";

  const img =
    document.createElement(
      "img"
    );

  img.src =
    src;

  img.alt =
    "Annual Report page "
    + (index + 1);

  page.appendChild(img);

  book.appendChild(page);

}


/* =========================================================
   UPDATE UI
========================================================= */

function update(index){

  if(index === 0){

    info.textContent =
      "Cover";

  }

  else if(index === total - 1){

    info.textContent =
      "Back cover";

  }

  else{

    const first =
      index + 1;

    const second =
      Math.min(
        index + 2,
        total - 1
      );

    info.textContent =
      `${first}–${second} / ${total}`;

  }


  book.classList.toggle(
    "spread",
    index > 0 &&
    index < total - 1
  );


  const atStart =
    index === 0;

  const atEnd =
    index === total - 1;


  prev.disabled =
    atStart;

  prevEdge.classList.toggle(
    "disabled",
    atStart
  );


  next.disabled =
    atEnd;

  nextEdge.classList.toggle(
    "disabled",
    atEnd
  );

}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom(){

  book.style.transform =
    `scale(${zoom})`;

  zoomLabel.textContent =
    Math.round(
      zoom * 100
    ) + "%";

}


/* =========================================================
   NAVIGATION
========================================================= */

function doNext(){

  if(pageFlip){

    pageFlip.flipNext(
      "bottom"
    );

  }

}


function doPrev(){

  if(pageFlip){

    pageFlip.flipPrev(
      "bottom"
    );

  }

}


prev.onclick =
  doPrev;

prevEdge.onclick =
  doPrev;

next.onclick =
  doNext;

nextEdge.onclick =
  doNext;


/* =========================================================
   ZOOM CONTROLS
========================================================= */

zoomIn.onclick = () => {

  zoom =
    Math.min(
      1.5,
      zoom + .1
    );

  applyZoom();

};


zoomOut.onclick = () => {

  zoom =
    Math.max(
      .8,
      zoom - .1
    );

  applyZoom();

};


zoomLabel.onclick = () => {

  zoom = 1;

  applyZoom();

};


/* =========================================================
   FULLSCREEN
========================================================= */

full.onclick =
  async () => {

    if(
      !document.fullscreenElement
    ){

      await document
        .documentElement
        .requestFullscreen?.();

    }

    else{

      await document
        .exitFullscreen?.();

    }

  };


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "ArrowRight" ||
      event.key ===
      "PageDown"
    ){

      doNext();

    }


    if(
      event.key ===
      "ArrowLeft" ||
      event.key ===
      "PageUp"
    ){

      doPrev();

    }


    if(event.key === "+"){

      zoom =
        Math.min(
          1.5,
          zoom + .1
        );

      applyZoom();

    }


    if(event.key === "-"){

      zoom =
        Math.max(
          .8,
          zoom - .1
        );

      applyZoom();

    }


    if(event.key === "0"){

      zoom = 1;

      applyZoom();

    }


    if(
      event.key.toLowerCase()
      === "f"
    ){

      full.click();

    }

  }
);


/* =========================================================
   LOAD THE BOOK
========================================================= */

try{

  pdf =
    await pdfjsLib
      .getDocument({
        url:PDF_FILE
      })
      .promise;


  total =
    pdf.numPages;


  setLoad(
    `Preparing ${total} pages…`
  );


  /* Render every PDF page */

  for(
    let i = 1;
    i <= total;
    i++
  ){

    setLoad(
      `Preparing page ${i} of ${total}…`
    );

    images.push(
      await render(i)
    );

  }


  /* Add pages to book */

  images.forEach(
    (src,index) => {

      createPage(
        src,
        index
      );

    }
  );


  /* =======================================================
     PAGE FLIP ENGINE
  ======================================================= */

  const PageFlip =
    window.St.PageFlip;


  if(!PageFlip){

    throw new Error(
      "Page flip library unavailable"
    );

  }


  const aspect =
    await pdf
      .getPage(1)
      .then(page =>
        page.getViewport({
          scale:1
        })
      );


  pageFlip =
    new PageFlip(
      book,
      {

        width:
          aspect.width,

        height:
          aspect.height,

        size:
          "stretch",

        minWidth:
          280,

        maxWidth:
          900,

        minHeight:
          396,

        maxHeight:
          1273,

        drawShadow:
          true,

        maxShadowOpacity:
          .42,

        flippingTime:
          780,

        usePortrait:
          true,

        showCover:
          true,

        startPage:
          0,

        autoSize:
          true,

        mobileScrollSupport:
          false,

        swipeDistance:
          35,

        useMouseEvents:
          true,

        disableFlipByClick:
          false

      }
    );


  /*
    Load the rendered PDF pages.
  */

  pageFlip.loadFromHtml(
    book.querySelectorAll(
      ".page"
    )
  );


  /* Page changed */

  pageFlip.on(
    "flip",
    event => {

      update(
        event.data
      );

    }
  );


  pageFlip.on(
    "changeOrientation",
    () => {

      update(
        pageFlip
          .getCurrentPageIndex()
      );

    }
  );


  update(0);


  /* Hide loader */

  loader.style.opacity =
    "0";

  setTimeout(
    () => {

      loader.style.display =
        "none";

    },
    320
  );


}

catch(error){

  console.error(error);

  setLoad(
    "Unable to open the annual report."
  );

  document
    .querySelector(
      ".spinner"
    )
    .style.display =
      "none";

}

</script>

</body>
</html>
